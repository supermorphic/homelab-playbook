[project]
name = "homelab-playbook-tools"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
fast = [
  "codespell==2.4.3",
  "yamllint==1.38.0",
  "zizmor==1.29.0",
]
ansible = [
  "ansible-core==2.21.3",
  "ansible-lint==26.8.0",
  "PyYAML==6.0.3",
]
dev = [
  { include-group = "fast" },
  { include-group = "ansible" },
]

[tool.uv]
package = false
python-preference = "only-system"
