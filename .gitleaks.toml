title = "homelab-playbook Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Exclude generated and local dependency directories"
paths = [
  '''^\.cache/galaxy(?:/|$)''',
  '''(^|/)\.git(?:/|$)''',
  '''(^|/)\.ansible(?:/|$)''',
  '''(^|/)\.venv(?:/|$)''',
  '''(^|/)\.tmp(?:/|$)''',
]
