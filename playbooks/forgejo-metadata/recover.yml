---
- name: Recover the scheduled Forgejo metadata service after convergence
  hosts: forgejo_metadata
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  become: false
  pre_tasks:
    - name: Reject password-based Forgejo credentials
      ansible.builtin.assert:
        that:
          - ansible_password is not defined
          - ansible_ssh_pass is not defined
          - ansible_ssh_password is not defined
          - ansible_become_password is not defined
          - ansible_become_pass is not defined
        fail_msg: >-
          Forgejo operations require key-only SSH and passwordless sudo for
          the ansible account
      no_log: true

    - name: Prove fresh administrative connection prerequisites
      ansible.builtin.import_role:
        name: os_bootstrap
        tasks_from: connection-preflight.yml

    - name: Gather privileged host facts
      ansible.builtin.setup:
      become: true

  tasks:
    - name: Recover the owned scheduled metadata service
      ansible.builtin.import_role:
        name: forgejo_metadata
        tasks_from: recover.yml
      become: true
