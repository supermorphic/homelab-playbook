---
- name: Prepare attended Forgejo maintenance
  hosts: forgejo
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  become: false
  pre_tasks:
    - name: Reject password-based Forgejo credentials
      ansible.builtin.assert:
        that:
          - ansible_password is not defined
          - ansible_ssh_pass is not defined
          - ansible_ssh_password is not defined
          - ansible_become_password is not defined
          - ansible_become_pass is not defined
        fail_msg: Forgejo requires key-only SSH and passwordless sudo for the ansible account
      no_log: true

    - name: Prove fresh administrative connection prerequisites
      ansible.builtin.import_role:
        name: os_bootstrap
        tasks_from: connection-preflight.yml

    - name: Gather privileged host facts
      ansible.builtin.setup:
      become: true
  tasks:
    - name: Preserve the source and gate Forgejo admission
      ansible.builtin.import_role:
        name: forgejo
        tasks_from: upgrade.yml
      vars:
        forgejo_upgrade_action: prepare
      become: true
