---
- name: Verify the Podman and Quadlet foundation without repair
  hosts: podman
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  become: false
  pre_tasks:
    - name: Reject password-based Podman credentials
      ansible.builtin.assert:
        that:
          - ansible_password is not defined
          - ansible_ssh_pass is not defined
          - ansible_ssh_password is not defined
          - ansible_become_password is not defined
          - ansible_become_pass is not defined
        fail_msg: >-
          Podman operations require key-only SSH and passwordless sudo for the
          ansible account
      no_log: true

    - name: Prove fresh administrative connection prerequisites
      ansible.builtin.import_role:
        name: os_bootstrap
        tasks_from: connection-preflight.yml

    - name: Gather privileged host facts
      ansible.builtin.setup:
      become: true

  tasks:
    - name: Observe and verify the Podman foundation
      ansible.builtin.import_role:
        name: podman_foundation
        tasks_from: verify.yml
      become: true
