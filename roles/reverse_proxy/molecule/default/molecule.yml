---
dependency:
  name: galaxy
  enabled: false

driver:
  name: default
  options:
    managed: true

platforms:
  - name: debian13
    hostname: reverse-proxy-debian13
    groups:
      - reverse_proxy
    image: localhost/homelab-playbook-reverse-proxy-debian13:local
    container_name: homelab-playbook-reverse-proxy-debian13
    container_command: /usr/lib/systemd/systemd
    container_cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
      - NET_ADMIN
    container_privileged: false
    container_systemd: always
    restart_policy: always
    pull: never
    user: ansible
    labels:
      io.supermorphic.homelab-playbook.repository: homelab-playbook
      io.supermorphic.homelab-playbook.scenario: reverse_proxy/default
      io.supermorphic.homelab-playbook.platform: debian13

provisioner:
  name: ansible
  log: true

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
