---
- name: Inspect reverse proxy parent directories
  proxy_metadata:
    paths:
      - /etc
      - /etc/systemd
      - /etc/systemd/system
      - /etc/tmpfiles.d
      - /usr
      - /usr/local
      - /usr/local/lib
      - /var
      - /var/lib
      - /run
      - /run/lock
  register: reverse_proxy_parent_directories

- name: Reject unsafe reverse proxy parent directories
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - not item.stat.islnk
      - item.stat.uid == 0
      - >-
        (item.item == '/run/lock'
         and item.stat.mode[0] == '1')
        or (item.stat.mode[-2] in ['0', '1', '4', '5']
            and item.stat.mode[-1] in ['0', '1', '4', '5'])
    fail_msg: >-
      A reverse proxy parent directory is missing, writable, or outside root
      ownership
  loop: "{{ reverse_proxy_parent_directories.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect managed reverse proxy directories
  proxy_metadata:
    paths:
      - /etc/caddy
      - /etc/caddy/tls
      - /etc/caddy/trust
      - /usr/local/lib/homelab-reverse-proxy
      - /var/lib/caddy
      - /var/lib/homelab-reverse-proxy
      - /usr/local/libexec
      - /etc/systemd/system/caddy.service.d
      - /run/caddy
  register: reverse_proxy_filesystem_boundaries

- name: Reject unsafe existing reverse proxy filesystem boundaries
  ansible.builtin.assert:
    that:
      - not item.stat.exists or item.stat.isdir
      - not item.stat.exists or not item.stat.islnk
      - >-
        not item.stat.exists
        or (item.item in ['/var/lib/caddy', '/run/caddy']
            and item.stat.pw_name == 'caddy'
            and item.stat.gr_name == 'caddy')
        or (item.item not in ['/var/lib/caddy', '/run/caddy']
            and item.stat.uid == 0)
      - >-
        not item.stat.exists
        or (item.stat.mode[-2] in ['0', '1', '4', '5']
            and item.stat.mode[-1] in ['0', '1', '4', '5'])
    fail_msg: >-
      An existing reverse proxy directory has unsafe ownership, type, or
      permissions
  loop: "{{ reverse_proxy_filesystem_boundaries.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect managed reverse proxy files
  proxy_metadata:
    paths:
      - /etc/caddy/Caddyfile
      - /etc/caddy/Caddyfile.candidate
      - /var/lib/homelab-reverse-proxy/managed
      - /usr/local/libexec/homelab-reverse-proxy
      - /usr/local/lib/homelab-reverse-proxy/proxy_config.py
      - /usr/local/lib/homelab-reverse-proxy/proxy_manifest.py
      - /var/lib/homelab-reverse-proxy/desired.candidate.json
      - /var/lib/homelab-reverse-proxy/ingress.candidate.json
      - /var/lib/homelab-reverse-proxy/trust.candidate.json
      - /var/lib/homelab-reverse-proxy/desired.json
      - /etc/systemd/system/caddy.service.d/override.conf
      - /etc/tmpfiles.d/homelab-reverse-proxy.conf
      - /run/lock/homelab-reverse-proxy.lock
  register: reverse_proxy_managed_files

- name: Reject unsafe existing reverse proxy files
  ansible.builtin.assert:
    that:
      - not item.stat.exists or item.stat.isreg
      - not item.stat.exists or not item.stat.islnk
      - not item.stat.exists or item.stat.uid == 0
      - not item.stat.exists or item.stat.nlink == 1
      - >-
        not item.stat.exists
        or (item.stat.mode[-2] in ['0', '1', '4', '5']
            and item.stat.mode[-1] in ['0', '1', '4', '5'])
    fail_msg: >-
      An existing reverse proxy file has unsafe ownership, type, links, or
      permissions
  loop: "{{ reverse_proxy_managed_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Establish administrator-owned reverse proxy directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/caddy, group: caddy, mode: '0750'}
    - {path: /etc/caddy/tls, group: caddy, mode: '0750'}
    - {path: /etc/caddy/trust, group: caddy, mode: '0750'}
    - {path: /usr/local/lib/homelab-reverse-proxy, group: root, mode: '0755'}
    - {path: /var/lib/homelab-reverse-proxy, group: root, mode: '0700'}
    - {path: /usr/local/libexec, group: root, mode: '0755'}
    - {path: /etc/systemd/system/caddy.service.d, group: root, mode: '0755'}

- name: Establish private Caddy state directory
  ansible.builtin.file:
    path: /var/lib/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: '0700'

- name: Establish initial admin-only boot configuration
  ansible.builtin.template:
    src: Caddyfile.admin.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: '0640'
  when: "'caddy' not in ansible_facts['packages']"
  no_log: true

- name: Mark reverse proxy as repository managed
  ansible.builtin.copy:
    content: "managed by homelab-playbook\n"
    dest: /var/lib/homelab-reverse-proxy/managed
    owner: root
    group: root
    mode: '0600'

- name: Remove package-added supplementary groups from Caddy
  ansible.builtin.user:
    name: caddy
    groups: ''
    append: false

- name: Install root-owned reverse proxy activation helper
  ansible.builtin.copy:
    src: activate.py
    dest: /usr/local/libexec/homelab-reverse-proxy
    owner: root
    group: root
    mode: '0755'

- name: Install the shared strict proxy renderer
  ansible.builtin.copy:
    src: "{{ role_path }}/filter_plugins/proxy.py"
    dest: /usr/local/lib/homelab-reverse-proxy/proxy_config.py
    owner: root
    group: root
    mode: '0644'

- name: Install the desired manifest runtime
  ansible.builtin.copy:
    src: manifest.py
    dest: /usr/local/lib/homelab-reverse-proxy/proxy_manifest.py
    owner: root
    group: root
    mode: '0644'

- name: Install reverse proxy volatile path policy
  ansible.builtin.template:
    src: homelab-reverse-proxy.tmpfiles.j2
    dest: /etc/tmpfiles.d/homelab-reverse-proxy.conf
    owner: root
    group: root
    mode: '0644'
  register: reverse_proxy_tmpfiles_configuration

- name: Apply reverse proxy volatile path policy
  ansible.builtin.command:
    argv:
      - /usr/bin/systemd-tmpfiles
      - --create
      - /etc/tmpfiles.d/homelab-reverse-proxy.conf
  changed_when: reverse_proxy_tmpfiles_configuration.changed

- name: Reconcile private runtime directory
  ansible.builtin.file:
    path: /run/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: '0700'

- name: Reconcile root-owned deployment lock
  ansible.builtin.file:
    path: /run/lock/homelab-reverse-proxy.lock
    state: touch
    owner: root
    group: root
    mode: '0600'
    access_time: preserve
    modification_time: preserve

- name: Prepare declared device trust for fixed installation
  ansible.builtin.copy:
    content: "{{ reverse_proxy_trust_certificates | to_json(sort_keys=true) }}"
    dest: /var/lib/homelab-reverse-proxy/trust.candidate.json
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false

- name: Install immutable device trust under the deployment lock
  ansible.builtin.command:
    argv: [/usr/local/libexec/homelab-reverse-proxy, install-trust]
  register: reverse_proxy_trust_installation
  changed_when: reverse_proxy_trust_installation.stdout | trim == 'changed'
  no_log: true

- name: Observe each declared immutable device trust bundle
  ansible.builtin.stat:
    path: "/etc/caddy/trust/{{ item.key }}.pem"
    follow: false
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  loop: "{{ reverse_proxy_trust_certificates | dict2items }}"
  register: reverse_proxy_installed_trust
  no_log: true

- name: Require this deployment's exact immutable trust contents
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg | default(false)
      - not item.stat.islnk | default(false)
      - item.stat.uid | default(-1) == 0
      - item.stat.gr_name | default('') == 'caddy'
      - item.stat.nlink | default(0) == 1
      - item.stat.mode | default('') == '0640'
      - item.stat.checksum | default('') == (item.item.value | hash('sha256'))
    fail_msg: The immutable trust name differs from this declaration; use a new name
  loop: "{{ reverse_proxy_installed_trust.results }}"
  no_log: true

- name: Install hardened reverse proxy systemd override
  ansible.builtin.template:
    src: caddy.service.conf.j2
    dest: /etc/systemd/system/caddy.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd manager for reverse proxy
    - Restart reverse proxy for systemd policy change
