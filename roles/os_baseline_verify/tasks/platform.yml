---
- name: Gather native MAC and chrony package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Read native MAC and chrony configuration
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: >-
    {{ ['/etc/selinux/config', '/etc/chrony.conf'] if ansible_os_family == 'RedHat'
       else ['/etc/apparmor/parser.conf', '/etc/chrony/chrony.conf'] }}
  register: os_baseline_verify_platform_configuration

- name: Verify native MAC and chrony policy evidence
  ansible.builtin.assert:
    that:
      - "'chrony' in ansible_facts.packages"
      - >-
        ('selinux-policy-targeted' in ansible_facts.packages and
         'SELINUX=enforcing' in (os_baseline_verify_platform_configuration.results[0].content | b64decode))
        if ansible_os_family == 'RedHat'
        else ('apparmor' in ansible_facts.packages and 'apparmor-utils' in ansible_facts.packages)
    fail_msg: Native MAC or chrony package/configuration policy is absent

- name: Read Rocky SELinux state
  ansible.builtin.command:
    argv: [/usr/sbin/getenforce]
  register: os_baseline_verify_selinux_state
  changed_when: false
  when:
    - os_baseline_verify_runtime_controls | bool
    - ansible_os_family == 'RedHat'

- name: Verify Rocky SELinux relabel recovery action
  ansible.builtin.assert:
    that:
      - os_baseline_verify_selinux_state.stdout | trim != 'Disabled'
    fail_msg: SELinux is Disabled; reboot the host to complete the authorized relabel.
  when:
    - os_baseline_verify_runtime_controls | bool
    - ansible_os_family == 'RedHat'
    - security_baseline_reboot_required | default(false) | bool

- name: Verify Rocky SELinux enforcement
  ansible.builtin.assert:
    that:
      - os_baseline_verify_selinux_state.stdout | trim == 'Enforcing'
    fail_msg: Rocky SELinux is not enforcing
  when:
    - os_baseline_verify_runtime_controls | bool
    - ansible_os_family == 'RedHat'
    - >-
      not (os_baseline_verify_selinux_state.stdout | trim == 'Disabled'
           and security_baseline_reboot_required | default(false) | bool)

- name: Check Debian AppArmor enablement
  ansible.builtin.command:
    argv: [/usr/sbin/aa-status, --enabled]
  register: os_baseline_verify_apparmor_enabled
  changed_when: false
  when:
    - os_baseline_verify_runtime_controls | bool
    - ansible_os_family == 'Debian'

- name: Read Debian AppArmor enforcing profile count
  ansible.builtin.command:
    argv: [/usr/sbin/aa-status, --enforced]
  register: os_baseline_verify_apparmor_profiles
  changed_when: false
  when:
    - os_baseline_verify_runtime_controls | bool
    - ansible_os_family == 'Debian'

- name: Verify Debian AppArmor enforcing profiles
  ansible.builtin.assert:
    that:
      - os_baseline_verify_apparmor_enabled.rc == 0
      - os_baseline_verify_apparmor_profiles.stdout | trim | int > 0
    fail_msg: Debian AppArmor is not enabled with loaded profiles
  when:
    - os_baseline_verify_runtime_controls | bool
    - ansible_os_family == 'Debian'

- name: Read chrony tracking state
  ansible.builtin.command:
    argv: [/usr/bin/chronyc, tracking]
  register: os_baseline_verify_chrony_tracking
  changed_when: false
  when: os_baseline_verify_runtime_controls | bool

- name: Read chrony source state
  ansible.builtin.command:
    argv: [/usr/bin/chronyc, sources]
  register: os_baseline_verify_chrony_sources
  changed_when: false
  when: os_baseline_verify_runtime_controls | bool

- name: Verify chrony synchronization
  ansible.builtin.assert:
    that:
      - "'Leap status     : Normal' in os_baseline_verify_chrony_tracking.stdout_lines"
      - >-
        os_baseline_verify_chrony_sources.stdout_lines
        | select('match', '^\\^[-+*]') | list | length > 0
    fail_msg: Chrony is not synchronized with an accepted source
  when: os_baseline_verify_runtime_controls | bool
