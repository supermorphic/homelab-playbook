---
dependency:
  name: galaxy
  enabled: false

driver:
  name: default
  options:
    managed: true

platforms:
  - name: debian13
    hostname: forgejo-metadata-debian13
    groups:
      - forgejo_metadata
    image: localhost/homelab-playbook-forgejo-metadata-debian13:local
    container_name: homelab-playbook-forgejo-metadata-debian13
    container_command: /usr/lib/systemd/systemd
    container_cap_add:
      - SYS_ADMIN
    container_privileged: false
    container_security_opt:
      # SELinux container policy blocks systemd's read-only credential ramfs
      # remount. This disposable rootless fixture has no host bind mounts.
      - label=disable
    container_systemd: always
    restart_policy: always
    pull: never
    user: ansible
    labels:
      io.supermorphic.homelab-playbook.repository: homelab-playbook
      io.supermorphic.homelab-playbook.scenario: forgejo_metadata/default
      io.supermorphic.homelab-playbook.platform: debian13

provisioner:
  name: ansible
  log: true
  env:
    ANSIBLE_LIBRARY: "${MOLECULE_PROJECT_DIRECTORY}/library"

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
