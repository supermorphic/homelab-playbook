---
- name: Install host Python and TLS trust
  ansible.builtin.apt:
    name: [python3, ca-certificates]
    state: present

- name: Create root-owned metadata installation boundaries
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: '{{ forgejo_metadata_helper_root }}', group: root, mode: '0755'}
    - {path: '{{ forgejo_metadata_config_root }}', group: root, mode: '0755'}
    - {path: '{{ forgejo_metadata_config_root }}/credentials', group: root, mode: '0700'}
    - {path: /run/forgejo-metadata, group: '{{ forgejo_metadata_account }}', mode: '0750'}

- name: Install metadata runtime package
  ansible.builtin.copy:
    src: forgejo_metadata
    dest: "{{ forgejo_metadata_helper_root }}/"
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'

- name: Install fixed attended submission helper
  ansible.builtin.copy:
    src: submit.py
    dest: "{{ forgejo_metadata_helper_root }}/submit.py"
    owner: root
    group: root
    mode: '0755'

- name: Install public metadata enrollment configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ forgejo_metadata_config_root }}/config.json"
    owner: root
    group: root
    mode: '0644'

- name: Install protected scoped metadata tokens
  ansible.builtin.copy:
    content: "{{ forgejo_metadata_tokens[item] }}"
    dest: "{{ forgejo_metadata_config_root }}/credentials/{{ item }}"
    owner: root
    group: root
    mode: '0600'
  loop: >-
    {{ (forgejo_metadata_mappings | map(attribute='source_credential') | list
        + forgejo_metadata_mappings | map(attribute='destination_credential') | list) | unique }}
  no_log: true
  diff: false

- name: Preserve control boundary across boot
  ansible.builtin.copy:
    content: "d /run/forgejo-metadata 0750 root {{ forgejo_metadata_account }} -\n"
    dest: /etc/tmpfiles.d/forgejo-metadata.conf
    owner: root
    group: root
    mode: '0644'
