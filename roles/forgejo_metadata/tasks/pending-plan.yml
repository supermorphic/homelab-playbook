---
- name: Validate current metadata host and declaration
  ansible.builtin.import_tasks: preflight.yml

- name: Verify current installed metadata definitions
  ansible.builtin.import_tasks: verify-definitions.yml

- name: Inspect pending creates with service credentials and read-only state
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ forgejo_metadata_helper_root }}/submit.py"
      - pending-plan
  register: forgejo_metadata_pending_plan
  changed_when: false

- name: Report pending create observations without resolving them
  ansible.builtin.debug:
    msg: "{{ forgejo_metadata_pending_plan.stdout | from_json }}"
