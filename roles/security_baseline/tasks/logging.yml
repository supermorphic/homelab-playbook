---
- name: Validate bounded journal size inputs
  ansible.builtin.assert:
    that:
      - >-
        security_baseline_journal_system_max_use
        | security_baseline_journal_size_is_valid
      - >-
        security_baseline_journal_system_keep_free
        | security_baseline_journal_size_is_valid
    fail_msg: Journal size limits must be non-zero systemd IEC sizes

- name: Create persistent journal storage
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render bounded persistent journal configuration
  ansible.builtin.template:
    src: journald-homelab.conf.j2
    dest: /etc/systemd/journald.conf.d/90-homelab.conf
    owner: root
    group: root
    mode: "0644"
  register: security_baseline_journald_config

- name: Read effective journald configuration
  ansible.builtin.command:
    argv:
      - /usr/bin/systemd-analyze
      - cat-config
      - systemd/journald.conf
  register: security_baseline_journald_effective
  changed_when: false

- name: Validate bounded persistent journald configuration
  vars:
    security_baseline_journald_values: >-
      {{ security_baseline_journald_effective.stdout
         | security_baseline_journald_effective_values }}
  ansible.builtin.assert:
    that:
      - security_baseline_journald_values.Storage == 'persistent'
      - >-
        security_baseline_journald_values.SystemMaxUse ==
        security_baseline_journal_system_max_use
      - >-
        security_baseline_journald_values.SystemKeepFree ==
        security_baseline_journal_system_keep_free
    fail_msg: Effective journald configuration does not match the baseline

- name: Queue journald restart after validated configuration change
  ansible.builtin.debug:
    msg: Bounded persistent journald configuration passed read-back
  changed_when: security_baseline_journald_config.changed
  notify: Restart journald

- name: Install audit service with vendor rules
  vars:
    security_baseline_audit_packages:
      Debian: auditd
      RedHat: audit
  block:
    - name: Validate audit package platform support
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] in security_baseline_audit_packages
        fail_msg: >-
          Unsupported audit package platform: {{ ansible_facts['os_family'] }}

    - name: Install platform audit package
      ansible.builtin.package:
        name: "{{ security_baseline_audit_packages[ansible_facts['os_family']] }}"
        state: present

- name: Enable and start auditd with vendor rules
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    state: started
  when: security_baseline_apply_audit_runtime | bool
