---
- name: Install Rocky SELinux packages
  ansible.builtin.package:
    name:
      - policycoreutils
      - selinux-policy-targeted
    state: present
  when: ansible_os_family == 'RedHat'

- name: Read Rocky SELinux state
  ansible.builtin.command:
    argv: [/usr/sbin/getenforce]
  register: security_baseline_selinux_state
  changed_when: false
  when: ansible_os_family == 'RedHat'

- name: Prepare disabled Rocky SELinux for a permissive relabel boot
  when:
    - ansible_os_family == 'RedHat'
    - security_baseline_apply_kernel_controls | bool
    - security_baseline_selinux_state.stdout | trim == 'Disabled'
  block:
    - name: Configure targeted SELinux permissive boot state
      ansible.posix.selinux:
        policy: targeted
        state: permissive
        update_kernel_param: true

    - name: Request a complete SELinux filesystem relabel
      ansible.builtin.file:
        path: /.autorelabel
        state: touch
        owner: root
        group: root
        mode: "0600"
        modification_time: preserve
        access_time: preserve

    - name: Record required SELinux relabel reboot
      ansible.builtin.set_fact:
        security_baseline_reboot_required: true

- name: Enforce active Rocky targeted SELinux
  ansible.posix.selinux:
    policy: targeted
    state: enforcing
    update_kernel_param: true
  register: security_baseline_selinux_enforcing
  when:
    - ansible_os_family == 'RedHat'
    - security_baseline_apply_kernel_controls | bool
    - security_baseline_selinux_state.stdout | trim in ['Permissive', 'Enforcing']

- name: Record Rocky SELinux configuration reboot requirement
  ansible.builtin.set_fact:
    security_baseline_reboot_required: >-
      {{ (security_baseline_reboot_required | bool)
         or (security_baseline_selinux_enforcing.reboot_required
             | default(false) | bool) }}
  when:
    - ansible_os_family == 'RedHat'
    - security_baseline_apply_kernel_controls | bool
    - security_baseline_selinux_state.stdout | trim in ['Permissive', 'Enforcing']

- name: Install Debian AppArmor packages
  ansible.builtin.package:
    name:
      - apparmor
      - apparmor-utils
      - apparmor-profiles
    state: present
  when:
    - ansible_os_family == 'Debian'

- name: Enable and start Debian AppArmor
  ansible.builtin.systemd_service:
    name: apparmor
    enabled: true
    state: started
  when:
    - ansible_os_family == 'Debian'
    - security_baseline_apply_kernel_controls | bool
