---
- name: Read homelab firewall list state
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/firewall-cmd']
         + security_baseline_firewall_state_scope
         + ['--zone=homelab', item] }}
  loop:
    - --list-interfaces
    - --list-sources
    - --list-services
    - --list-ports
    - --list-protocols
    - --list-source-ports
    - --list-forward-ports
    - --list-rich-rules
  register: security_baseline_firewall_list_state
  changed_when: false
  no_log: true

- name: Read homelab firewall scalar state
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/firewall-cmd']
         + security_baseline_firewall_state_scope
         + ['--zone=homelab', item] }}
  loop:
    - --get-target
    - --query-forward
    - --query-masquerade
  register: security_baseline_firewall_scalar_state
  changed_when: false
  failed_when: security_baseline_firewall_scalar_state.rc not in [0, 1]

- name: Read management interface firewall zone
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/firewall-cmd']
         + security_baseline_firewall_state_scope
         + ['--get-zone-of-interface='
            ~ security_baseline_firewall_management.interface] }}
  register: security_baseline_firewall_interface_zone
  changed_when: false

- name: Assemble homelab firewall state
  ansible.builtin.set_fact:
    security_baseline_firewall_snapshot:
      target: "{{ security_baseline_firewall_scalar_state.results[0].stdout | trim }}"
      forward: "{{ security_baseline_firewall_scalar_state.results[1].rc == 0 }}"
      masquerade: "{{ security_baseline_firewall_scalar_state.results[2].rc == 0 }}"
      interface_zone: "{{ security_baseline_firewall_interface_zone.stdout | trim }}"
      interfaces: "{{ security_baseline_firewall_list_state.results[0].stdout.split() }}"
      sources: "{{ security_baseline_firewall_list_state.results[1].stdout.split() }}"
      services: "{{ security_baseline_firewall_list_state.results[2].stdout.split() }}"
      ports: "{{ security_baseline_firewall_list_state.results[3].stdout.split() }}"
      protocols: "{{ security_baseline_firewall_list_state.results[4].stdout.split() }}"
      source_ports: "{{ security_baseline_firewall_list_state.results[5].stdout.split() }}"
      forward_ports: "{{ security_baseline_firewall_list_state.results[6].stdout.split() }}"
      rich_rules: "{{ security_baseline_firewall_list_state.results[7].stdout_lines }}"
  no_log: true
