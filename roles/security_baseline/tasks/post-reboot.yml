---
- name: Read Rocky SELinux state after controlled relabel boot
  ansible.builtin.command:
    argv: [/usr/sbin/getenforce]
  register: security_baseline_post_reboot_selinux_state
  changed_when: false
  when:
    - ansible_os_family == 'RedHat'
    - security_baseline_apply_kernel_controls | bool

- name: Enforce targeted SELinux after controlled relabel boot
  ansible.posix.selinux:
    policy: targeted
    state: enforcing
    update_kernel_param: true
  when:
    - ansible_os_family == 'RedHat'
    - security_baseline_apply_kernel_controls | bool
    - security_baseline_post_reboot_selinux_state.stdout | trim == 'Permissive'
