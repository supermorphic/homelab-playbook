---
- name: Validate enabled Debian repository trust
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import pathlib
        import re
        import shlex
        import sys
        import urllib.parse

        allowed_hosts = {"deb.debian.org", "security.debian.org"}
        source_files = [pathlib.Path("/etc/apt/sources.list")]
        source_files.extend(pathlib.Path("/etc/apt/sources.list.d").glob("*.list"))
        source_files.extend(pathlib.Path("/etc/apt/sources.list.d").glob("*.sources"))
        enabled_uris = []

        def reject_untrusted(value):
            if value.strip().lower() in {"yes", "true"}:
                raise SystemExit(1)

        for path in source_files:
            if not path.is_file():
                continue
            text = path.read_text(encoding="utf-8")
            if path.suffix != ".sources":
                for raw_line in text.splitlines():
                    line = raw_line.strip()
                    if not line or line.startswith("#"):
                        continue
                    fields = shlex.split(line, comments=True)
                    if not fields or fields[0] not in {"deb", "deb-src"}:
                        continue
                    if re.search(r"\btrusted\s*=\s*(yes|true)\b", line, re.I):
                        raise SystemExit(1)
                    uri_index = 1
                    if fields[uri_index].startswith("["):
                        while uri_index < len(fields) and not fields[uri_index].endswith("]"):
                            uri_index += 1
                        uri_index += 1
                    if uri_index >= len(fields):
                        raise SystemExit(1)
                    enabled_uris.append(fields[uri_index])
                continue

            for paragraph in re.split(r"\n\s*\n", text):
                values = {}
                current = None
                for raw_line in paragraph.splitlines():
                    if not raw_line.strip() or raw_line.lstrip().startswith("#"):
                        continue
                    if raw_line[:1].isspace() and current:
                        values[current] += " " + raw_line.strip()
                        continue
                    if ":" not in raw_line:
                        raise SystemExit(1)
                    key, value = raw_line.split(":", 1)
                    current = key.strip().lower()
                    values[current] = value.strip()
                if not values or values.get("enabled", "yes").lower() == "no":
                    continue
                if not set(values.get("types", "").split()) & {"deb", "deb-src"}:
                    continue
                reject_untrusted(values.get("trusted", "no"))
                enabled_uris.extend(values.get("uris", "").split())

        if not enabled_uris:
            raise SystemExit(1)
        for uri in enabled_uris:
            parsed = urllib.parse.urlparse(uri)
            if parsed.scheme not in {"http", "https"} or parsed.hostname not in allowed_hosts:
                raise SystemExit(1)
  changed_when: false
  when: ansible_os_family == 'Debian'

- name: Validate enabled Rocky repository trust
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import configparser
        import pathlib

        allowed_ids = {"baseos", "appstream", "extras", "crb"}
        disabled_values = {"0", "false", "no", "off"}
        parser = configparser.RawConfigParser(strict=True)
        parser.read(sorted(pathlib.Path("/etc/yum.repos.d").glob("*.repo")))
        enabled_ids = []
        for repo_id in parser.sections():
            enabled = parser.get(repo_id, "enabled", fallback="1").strip().lower()
            if enabled in disabled_values:
                continue
            enabled_ids.append(repo_id.lower())
            gpgcheck = parser.get(repo_id, "gpgcheck", fallback="1").strip().lower()
            if gpgcheck in disabled_values:
                raise SystemExit(1)
        if not enabled_ids or any(repo_id not in allowed_ids for repo_id in enabled_ids):
            raise SystemExit(1)
  changed_when: false
  when: ansible_os_family == 'RedHat'

- name: Install repository trust and time packages
  ansible.builtin.package:
    name:
      - ca-certificates
      - chrony
    state: present

- name: Select chrony platform paths
  ansible.builtin.set_fact:
    security_baseline_chrony_config_path: >-
      {{ '/etc/chrony/chrony.conf'
         if ansible_os_family == 'Debian'
         else '/etc/chrony.conf' }}
    security_baseline_chrony_service_name: >-
      {{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}

- name: Validate trusted chrony source formats
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import ipaddress
        import json
        import re
        import sys

        sources = json.loads(sys.argv[1])
        label = re.compile(r"^(?!-)[A-Za-z0-9-]{1,63}(?<!-)$")
        for source in sources:
            if not isinstance(source, str) or not source or len(source) > 253:
                raise SystemExit(1)
            try:
                ipaddress.ip_address(source)
                continue
            except ValueError:
                hostname = source[:-1] if source.endswith(".") else source
                if not hostname or not all(label.fullmatch(part) for part in hostname.split(".")):
                    raise SystemExit(1)
      - "{{ security_baseline_chrony_sources | to_json }}"
  changed_when: false
  no_log: true
  when: security_baseline_chrony_sources | length > 0

- name: Add trusted chrony sources before disabling vendor sources
  ansible.builtin.blockinfile:
    path: "{{ security_baseline_chrony_config_path }}"
    marker: "# {mark} ANSIBLE MANAGED TRUSTED CHRONY SOURCES"
    insertbefore: BOF
    block: |-
      {% for source in security_baseline_chrony_sources %}
      server {{ source }} iburst
      {% endfor %}
    validate: /usr/sbin/chronyd -p -f %s
  notify: Restart chrony
  no_log: true
  when: security_baseline_chrony_sources | length > 0

- name: Disable vendor chrony sources after adding trusted sources
  ansible.builtin.replace:
    path: "{{ security_baseline_chrony_config_path }}"
    regexp: '^(?!# homelab-disabled: )([ \t]*(?:pool|server)[ \t]+[^\n]+)$'
    replace: '# homelab-disabled: \g<1>'
    after: '(?m)^# END ANSIBLE MANAGED TRUSTED CHRONY SOURCES$'
    validate: /usr/sbin/chronyd -p -f %s
  notify: Restart chrony
  when: security_baseline_chrony_sources | length > 0

- name: Restore exact vendor chrony source lines before removing trusted sources
  ansible.builtin.replace:
    path: "{{ security_baseline_chrony_config_path }}"
    regexp: '^# homelab-disabled: ([^\n]+)$'
    replace: '\g<1>'
    validate: /usr/sbin/chronyd -p -f %s
  notify: Restart chrony
  when: security_baseline_chrony_sources | length == 0

- name: Remove trusted chrony sources after restoring vendor sources
  ansible.builtin.blockinfile:
    path: "{{ security_baseline_chrony_config_path }}"
    marker: "# {mark} ANSIBLE MANAGED TRUSTED CHRONY SOURCES"
    state: absent
    validate: /usr/sbin/chronyd -p -f %s
  notify: Restart chrony
  when: security_baseline_chrony_sources | length == 0

- name: Enable and start chrony
  ansible.builtin.systemd_service:
    name: "{{ security_baseline_chrony_service_name }}"
    enabled: true
    state: started
  when: security_baseline_apply_time_runtime | bool
