---
- name: Validate reserved disposable runner identities
  ansible.builtin.import_tasks: reservations.yml

- name: Read effective host users
  ansible.builtin.command:
    argv: [/usr/bin/getent, passwd]
  register: podman_foundation_passwd
  changed_when: false
  check_mode: false
  no_log: true

- name: Read effective host groups
  ansible.builtin.command:
    argv: [/usr/bin/getent, group]
  register: podman_foundation_group
  changed_when: false
  check_mode: false
  no_log: true

- name: Read subordinate identity allocations
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import pathlib,sys;
        p=pathlib.Path(sys.argv[1]);
        print(p.read_text() if p.exists() else '', end='')
      - "{{ item }}"
  loop: [/etc/subuid, /etc/subgid]
  register: podman_foundation_subids
  changed_when: false
  check_mode: false
  no_log: true

- name: Validate declared identities against current allocations
  ansible.builtin.assert:
    that:
      - >-
        podman_foundation_accounts | podman_foundation_validate_accounts(
          podman_foundation_passwd.stdout, podman_foundation_group.stdout,
          podman_foundation_subids.results[0].stdout,
          podman_foundation_subids.results[1].stdout,
          podman_foundation_require_present | default(false),
          podman_foundation_pending | default([])) == podman_foundation_accounts
    fail_msg: Podman identity allocation failed; inspect declared identities and host allocations before retrying
