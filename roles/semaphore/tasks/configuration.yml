---
- name: Install protected Semaphore runtime environments
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ semaphore_state_root }}/credentials/{{ item.dest }}"
    owner: "{{ semaphore_account_name }}"
    group: "{{ semaphore_account_name }}"
    mode: '0600'
  loop:
    - {src: semaphore.env.j2, dest: semaphore.env}
    - {src: postgres.env.j2, dest: postgres.env}
  no_log: true
  diff: false
  register: semaphore_runtime_environments

- name: Install protected rclone configuration
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "{{ semaphore_state_root }}/credentials/rclone.conf"
    owner: "{{ semaphore_account_name }}"
    group: "{{ semaphore_account_name }}"
    mode: '0600'
  when: semaphore_backups_enabled | bool
  no_log: true
  diff: false
  register: semaphore_rclone_configuration

- name: Install strict controller SSH policy
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ semaphore_state_root }}/credentials/ssh_config"
    owner: root
    group: "{{ semaphore_account_name }}"
    mode: '0640'
  register: semaphore_ssh_configuration

- name: Establish strict known-host input
  ansible.builtin.copy:
    content: "{{ semaphore_ssh_known_hosts | default('') }}"
    dest: "{{ semaphore_state_root }}/credentials/known_hosts"
    owner: root
    group: "{{ semaphore_account_name }}"
    mode: '0640'
  no_log: true
  diff: false
  register: semaphore_known_hosts

- name: Install Semaphore operational helpers
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ semaphore_helper_root }}/{{ item }}"
    owner: root
    group: "{{ semaphore_account_name }}"
    mode: '0750'
  loop: "{{ ['backup.sh', 'transfer.sh'] if semaphore_backups_enabled | bool else [] }}"
  register: semaphore_helpers

- name: Install controller identity command helper
  ansible.builtin.copy:
    src: identity-command.py
    dest: "{{ semaphore_helper_root }}/identity-command.py"
    owner: root
    group: "{{ semaphore_account_name }}"
    mode: '0750'
  register: semaphore_identity_helper
  when: semaphore_controller_identity_enabled | bool

- name: Install native repository job wrapper before application startup
  ansible.builtin.copy:
    src: repository-job.py
    dest: "{{ semaphore_helper_root }}/repository-job.py"
    owner: root
    group: "{{ semaphore_account_name }}"
    mode: '0750'
  register: semaphore_repository_job_wrapper
  when: semaphore_controller_enabled | bool

- name: Install fixed controller job declaration before application startup
  ansible.builtin.template:
    src: repository-job.json.j2
    dest: "{{ semaphore_helper_root }}/repository-job.json"
    owner: root
    group: "{{ semaphore_account_name }}"
    mode: '0640'
  register: semaphore_controller_declaration
  when: semaphore_controller_enabled | bool

- name: Install protected controller SSH private key before application startup
  ansible.builtin.copy:
    content: "{{ semaphore_controller_ssh_private_key }}\n"
    dest: "{{ semaphore_state_root }}/credentials/config/controller-ssh"
    owner: "{{ semaphore_account_name }}"
    group: "{{ semaphore_account_name }}"
    mode: '0600'
  no_log: true
  diff: false
  register: semaphore_controller_ssh_key
  when: semaphore_controller_enabled | bool

- name: Configure protected controller identity adapter
  ansible.builtin.import_tasks: identity.yml
  when: semaphore_controller_identity_enabled | bool
