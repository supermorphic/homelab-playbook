---
- name: Validate Semaphore inputs and existing infrastructure
  ansible.builtin.import_tasks: preflight.yml

- name: Establish Semaphore storage
  ansible.builtin.import_tasks: storage.yml

- name: Configure Semaphore protected runtime inputs
  ansible.builtin.import_tasks: configuration.yml

- name: Enforce controller toolchain compatibility gate
  ansible.builtin.import_tasks: toolchain.yml

- name: Reconcile Semaphore services
  ansible.builtin.import_tasks: services.yml

- name: Reconcile the declared Semaphore controller job
  ansible.builtin.include_tasks: controller.yml
  when: semaphore_controller_enabled | bool

- name: Verify the reconciled Semaphore deployment
  ansible.builtin.import_tasks: verify.yml
