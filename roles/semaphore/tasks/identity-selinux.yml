---
- name: Install distribution SELinux policy build tools
  ansible.builtin.package:
    name:
      - selinux-policy-devel
      - container-selinux
      - policycoreutils
      - make
    state: present

- name: Inspect controller policy build directory
  ansible.builtin.stat:
    path: /etc/semaphore/selinux
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: semaphore_identity_policy_directory

- name: Refuse an unexpected controller policy directory
  ansible.builtin.assert:
    that:
      - >-
        not semaphore_identity_policy_directory.stat.exists or
        (semaphore_identity_policy_directory.stat.isdir | default(false) and
         not (semaphore_identity_policy_directory.stat.islnk | default(false)) and
         semaphore_identity_policy_directory.stat.uid | default(-1) == 0 and
         semaphore_identity_policy_directory.stat.mode | default('') == '0700')

- name: Create private administrator-owned controller policy directory
  ansible.builtin.file:
    path: /etc/semaphore/selinux
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Install scoped controller SELinux policy source
  ansible.builtin.copy:
    src: "semaphore_controller.{{ item }}"
    dest: "/etc/semaphore/selinux/semaphore_controller.{{ item }}"
    owner: root
    group: root
    mode: '0600'
  loop:
    - te  # codespell:ignore te
    - fc
  register: semaphore_identity_policy_source

- name: Observe installed controller SELinux module
  ansible.builtin.command: /usr/sbin/semodule --list
  changed_when: false
  register: semaphore_identity_policy_modules

- name: Build and install changed controller SELinux policy
  when: >-
    semaphore_identity_policy_source.changed or
    semaphore_identity_policy_modules.stdout is not search('(?m)^semaphore_controller\s')
  block:
    - name: Compile controller policy using distribution interfaces
      ansible.builtin.command:
        argv:
          - make
          - -f
          - /usr/share/selinux/devel/Makefile
          - semaphore_controller.pp
        chdir: /etc/semaphore/selinux
      changed_when: true

    - name: Install compiled application-specific SELinux module
      ansible.builtin.command:
        argv:
          - /usr/sbin/semodule
          - --install
          - /etc/semaphore/selinux/semaphore_controller.pp
      changed_when: true
