---
- name: Validate Forgejo deployment prerequisites
  ansible.builtin.import_tasks: preflight.yml

- name: Prepare Forgejo service capability
  ansible.builtin.import_tasks: storage.yml

- name: Stage and publish one Forgejo reconciliation transaction
  block:
    - name: Stage private Forgejo configuration
      ansible.builtin.import_tasks: configuration.yml

    - name: Stage Forgejo service definitions
      ansible.builtin.import_tasks: definitions.yml

    - name: Stage Forgejo backup and recovery definitions
      ansible.builtin.import_tasks: backups.yml

    - name: Reconcile Forgejo runtime
      ansible.builtin.import_tasks: services.yml
  always:
    - name: Remove only this invocation's private candidate
      ansible.builtin.file:
        path: "{{ forgejo_candidate.path }}"
        state: absent
      when: forgejo_candidate.path is defined
      changed_when: false
      no_log: true
