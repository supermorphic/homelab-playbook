---
- name: Establish private Forgejo service directories
  ansible.builtin.file:
    path: "{{ forgejo_state_root }}{{ item }}"
    state: directory
    owner: svc-forgejo
    group: svc-forgejo
    mode: '0700'
  loop: ['', /data, /database, /config, /credentials, /backups]

- name: Establish administrator-owned Forgejo helper directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /usr/local/libexec, group: root, mode: '0755'}
    - {path: "{{ forgejo_helper_root }}", group: svc-forgejo, mode: '0750'}
    - {path: "{{ forgejo_helper_root }}/candidates", group: root, mode: '0700'}
    - {path: /run/forgejo, group: svc-forgejo, mode: '0750'}

- name: Install persistent Forgejo operation-lock boot declaration
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/forgejo.conf
    content: |
      d /run/forgejo 0750 root svc-forgejo -
      f /run/forgejo/operation.lock 0660 root svc-forgejo -
      f /run/forgejo/upgrade-capture.lock 0660 root svc-forgejo -
    owner: root
    group: root
    mode: '0644'

- name: Establish operation lock without replacing its inode
  ansible.builtin.copy:
    dest: /run/forgejo/operation.lock
    content: ''
    force: false
    owner: root
    group: svc-forgejo
    mode: '0660'

- name: Establish upgrade capture lock without replacing its inode
  ansible.builtin.copy:
    dest: /run/forgejo/upgrade-capture.lock
    content: ''
    force: false
    owner: root
    group: svc-forgejo
    mode: '0660'

- name: Establish Forgejo account configuration parent
  ansible.builtin.file:
    path: /var/lib/svc-forgejo/.config
    state: directory
    owner: svc-forgejo
    group: svc-forgejo
    mode: '0700'

- name: Establish administrator-owned user-unit directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: svc-forgejo
    mode: '0750'
  loop:
    - /var/lib/svc-forgejo/.config/systemd
    - "{{ forgejo_user_unit_root }}"
    - "{{ forgejo_user_unit_root }}/timers.target.wants"
    - "{{ forgejo_user_unit_root }}/default.target.wants"

- name: Install one compatible Forgejo helper generation
  block:
    - name: Stage private helper bundle
      ansible.builtin.tempfile:
        state: directory
        path: "{{ forgejo_helper_root }}/candidates"
        prefix: helpers-
      register: forgejo_helper_candidate
      changed_when: false

    - name: Copy trusted helper bundle into private staging
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ forgejo_helper_candidate.path }}/{{ item }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - profiles.py
        - service.py
        - archive.py
        - backup.py
        - transfer.py
        - mirror_status.py
        - upgrade_state.py
        - install.py
        - upgrade.py
        - admission.py
        - upgrade_host.py
      changed_when: false

    - name: Check installed pins and publish a compatible helper generation
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - "{{ forgejo_helper_candidate.path }}/install.py"
          - --candidate
          - "{{ forgejo_helper_candidate.path }}"
          - --image
          - "{{ forgejo_image }}"
          - --postgres-image
          - "{{ forgejo_postgres_image }}"
      register: forgejo_helper_installation
      changed_when: >-
        forgejo_helper_installation.rc == 0
        and (forgejo_helper_installation.stdout | from_json).changed | bool
  always:
    - name: Remove only this invocation's private helper candidate
      ansible.builtin.file:
        path: "{{ forgejo_helper_candidate.path }}"
        state: absent
      when: forgejo_helper_candidate.path is defined
      changed_when: false
