---
- name: Generate disposable Molecule controller keys
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    system_maintenance_molecule_key_directory: >-
      {{ molecule_ephemeral_directory }}/controller-key
    system_maintenance_molecule_private_key: >-
      {{ system_maintenance_molecule_key_directory }}/id_ed25519
  tasks:
    - name: Create the private ephemeral key directory
      ansible.builtin.file:
        path: "{{ system_maintenance_molecule_key_directory }}"
        state: directory
        mode: "0700"
      no_log: true

    - name: Generate the disposable Ed25519 controller key
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -f
          - "{{ system_maintenance_molecule_private_key }}"
        creates: "{{ system_maintenance_molecule_private_key }}"
      no_log: true

    - name: Read the disposable controller public key
      ansible.builtin.slurp:
        src: "{{ system_maintenance_molecule_private_key }}.pub"
      register: system_maintenance_molecule_public_key_file
      no_log: true

    - name: Record the disposable controller public key
      ansible.builtin.set_fact:
        system_maintenance_molecule_public_key: >-
          {{ system_maintenance_molecule_public_key_file.content
             | b64decode | trim }}
      no_log: true

- name: Load synthetic proxy intent for the complete provisioning lifecycle
  hosts: os_managed
  gather_facts: false
  tasks:
    - name: Load shared disposable TLS and proxy declarations
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/tls.yml"

- name: Converge the production complete provisioning lifecycle
  ansible.builtin.import_playbook: ../../../../playbooks/os/provision.yml
  vars:
    host_identity_hostname: "molecule-{{ inventory_hostname }}"
    host_identity_timezone: Etc/UTC
    os_baseline_verify_runtime_controls: false
    os_reboot_boot_time_command: /usr/bin/stat -c %y /proc/1
    security_baseline_apply_audit_runtime: false
    security_baseline_apply_firewall_runtime: false
    security_baseline_apply_kernel_controls: false
    security_baseline_apply_time_runtime: false
    security_baseline_authorized_keys:
      - "{{ hostvars['localhost'].system_maintenance_molecule_public_key }}"
    security_baseline_management_sources:
      - 10.0.0.0/8
    security_baseline_sshd_connection_context:
      host: 127.0.0.1
      peer: 127.0.0.1
      local_address: 127.0.0.1
      local_port: 22
    os_baseline_verify_sshd_connection_context:
      host: 127.0.0.1
      peer: 127.0.0.1
      local_address: 127.0.0.1
      local_port: 22
    system_maintenance_native_reboot_enabled: false

- name: Converge synthetic Podman foundation identities
  hosts: os_managed
  gather_facts: true
  become: true
  vars_files:
    - vars/podman.yml
  tasks:
    - name: Reserve unrelated synthetic subordinate allocations
      ansible.builtin.lineinfile:
        path: "/etc/sub{{ item }}"
        line: svc-fixture-unmanaged:500000:65536
        create: true
        owner: root
        group: root
        mode: '0644'
      loop: [uid, gid]

    - name: Reconcile the reusable Podman foundation
      ansible.builtin.import_role:
        name: podman_foundation

    - name: Install a secret-free Quadlet generator fixture without startup targets
      ansible.builtin.copy:
        dest: /etc/containers/systemd/users/2001/foundation-fixture.container
        owner: root
        group: svc-fixture-a
        mode: '0640'
        content: |
          [Container]
          Image=docker.io/library/alpine:3.22.1
          Exec=/bin/true

- name: Converge disabled off-cluster TLS capability without credentials
  hosts: os_managed
  gather_facts: true
  become: true
  vars_files:
    - vars/tls.yml
  tasks:
    - name: Discover the disposable TLS address after OS Python bootstrap
      ansible.builtin.include_tasks: tasks/tls-address.yml

    - name: Install real Caddy with deferred routes before the disabled TLS capability  # noqa: var-naming[no-role-prefix]
      ansible.builtin.include_role:
        name: reverse_proxy
      vars:
        security_baseline_management_sources:
          - 10.0.0.0/8
        security_baseline_apply_firewall_runtime: false
        os_baseline_verify_runtime_controls: false

    - name: Install the off-cluster TLS capability
      ansible.builtin.import_role:
        name: tls_automation
