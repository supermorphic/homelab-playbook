---
- name: Independently verify the complete OS baseline
  hosts: os_managed
  gather_facts: true
  become: true
  pre_tasks:
    - name: Load proxy declarations for all standalone verification plays
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/tls.yml"
  vars:
    system_maintenance_molecule_baseline_expected_authorized_key: >-
      {{ lookup(
           'ansible.builtin.file',
           molecule_ephemeral_directory ~ '/controller-key/id_ed25519.pub'
         ) | trim }}
    system_maintenance_molecule_baseline_minimum_packages:
      - apparmor
      - apparmor-profiles
      - apparmor-utils
      - auditd
      - ca-certificates
      - firewalld
      - openssh-server
      - python3
      - sudo
      - systemd-timesyncd
      - unattended-upgrades
    system_maintenance_molecule_baseline_recurring_full_update_artifacts:
      - /etc/cron.d/homelab-full-update
      - /etc/systemd/system/homelab-full-update.service
      - /etc/systemd/system/homelab-full-update.timer
  tasks:
    - name: Read static hostname
      ansible.builtin.command:
        argv: [/usr/bin/hostnamectl, --static]
      register: system_maintenance_molecule_baseline_static_hostname
      changed_when: false

    - name: Read current hostname
      ansible.builtin.command:
        argv: [/usr/bin/hostnamectl, --transient]
      register: system_maintenance_molecule_baseline_current_hostname
      changed_when: false

    - name: Read effective system timezone
      ansible.builtin.command:
        argv: [/usr/bin/timedatectl, show, --property=Timezone, --value]
      register: system_maintenance_molecule_baseline_timezone
      changed_when: false

    - name: Verify effective host identity
      ansible.builtin.assert:
        that:
          - >-
            system_maintenance_molecule_baseline_static_hostname.stdout | trim ==
            'molecule-' ~ inventory_hostname
          - >-
            system_maintenance_molecule_baseline_current_hostname.stdout | trim ==
            'molecule-' ~ inventory_hostname
          - >-
            system_maintenance_molecule_baseline_timezone.stdout | trim == 'Etc/UTC'

    - name: Gather independently observable package state
      ansible.builtin.package_facts:
        manager: auto

    - name: Read the ansible account
      ansible.builtin.command:
        argv: [getent, passwd, ansible]
      register: system_maintenance_molecule_baseline_ansible_passwd
      changed_when: false

    - name: Read the locked ansible password record
      ansible.builtin.command:
        argv: [getent, shadow, ansible]
      register: system_maintenance_molecule_baseline_ansible_shadow
      changed_when: false
      no_log: true

    - name: Read authoritative authorized_keys
      ansible.builtin.slurp:
        src: /home/ansible/.ssh/authorized_keys
      register: system_maintenance_molecule_baseline_authorized_keys
      no_log: true

    - name: Read the repository-owned sudo policy
      ansible.builtin.stat:
        path: /etc/sudoers.d/90-ansible
      register: system_maintenance_molecule_baseline_sudo_policy

    - name: Read the repository-owned sudo policy content
      ansible.builtin.slurp:
        src: /etc/sudoers.d/90-ansible
      register: system_maintenance_molecule_baseline_sudo_policy_content
      no_log: true

    - name: Validate the repository-owned sudo policy syntax
      ansible.builtin.command:
        argv: [/usr/sbin/visudo, -cf, /etc/sudoers.d/90-ansible]
      changed_when: false

    - name: Prove installer-independent passwordless sudo
      become: true
      become_user: ansible
      ansible.builtin.command:
        argv: [sudo, -n, "true"]
      changed_when: false

    - name: Verify account, key, and sudo file state
      ansible.builtin.assert:
        that:
          - system_maintenance_molecule_baseline_ansible_passwd.stdout.split(':')[6] == '/bin/bash'
          - system_maintenance_molecule_baseline_ansible_shadow.stdout.split(':')[1] is match('^[!*]')
          - system_maintenance_molecule_baseline_authorized_keys.content | b64decode | trim == system_maintenance_molecule_baseline_expected_authorized_key
          - system_maintenance_molecule_baseline_sudo_policy.stat.pw_name == 'root'
          - system_maintenance_molecule_baseline_sudo_policy.stat.gr_name == 'root'
          - system_maintenance_molecule_baseline_sudo_policy.stat.mode == '0440'
          - >-
            system_maintenance_molecule_baseline_sudo_policy_content.content
            | b64decode | trim | split('\n') ==
            ['# Ansible managed', 'ansible ALL=(ALL:ALL) NOPASSWD: ALL']
        fail_msg: The administrative account, key, or sudo policy is incorrect
      no_log: true

    - name: Check OpenSSH syntax with sshd -t
      ansible.builtin.command:
        cmd: /usr/sbin/sshd -t
      changed_when: false

    - name: Read effective OpenSSH policy for the administrative context
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
          - -C
          - user=ansible,host=127.0.0.1,addr=127.0.0.1,laddr=127.0.0.1,lport=22
      register: system_maintenance_molecule_baseline_sshd_effective
      changed_when: false

    - name: Verify effective OpenSSH policy
      vars:
        system_maintenance_molecule_baseline_sshd_problems: >-
          {{ system_maintenance_molecule_baseline_sshd_effective.stdout_lines
             | system_maintenance_molecule_baseline_sshd_errors }}
      ansible.builtin.assert:
        that:
          - system_maintenance_molecule_baseline_sshd_problems | length == 0

    - name: Exercise an adversarial matching OpenSSH policy in memory
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
          - -f
          - /dev/stdin
          - -C
          - user=ansible,host=controller.example.invalid,addr=127.0.0.1,laddr=127.0.0.1,lport=22
        stdin: |
          Include /etc/ssh/sshd_config
          Match Host controller.example.invalid User ansible
            PasswordAuthentication yes
            AllowTcpForwarding yes
      register: system_maintenance_molecule_baseline_sshd_adversarial
      changed_when: false

    - name: Prove the oracle rejects matching SSH weakening
      vars:
        system_maintenance_molecule_baseline_sshd_adversarial_problems: >-
          {{ system_maintenance_molecule_baseline_sshd_adversarial.stdout_lines
             | system_maintenance_molecule_baseline_sshd_errors }}
      ansible.builtin.assert:
        that:
          - "'passwordauthentication' in system_maintenance_molecule_baseline_sshd_adversarial_problems"
          - "'allowtcpforwarding' in system_maintenance_molecule_baseline_sshd_adversarial_problems"

    - name: Read permanent firewalld default configuration
      ansible.builtin.slurp:
        src: /etc/firewalld/firewalld.conf
      register: system_maintenance_molecule_baseline_firewalld_configuration
      no_log: true

    - name: Read exact permanent homelab firewall state
      ansible.builtin.command:
        argv:
          - /usr/bin/firewall-offline-cmd
          - --zone=homelab
          - "{{ item }}"
      loop:
        - --list-all
        - --list-interfaces
        - --list-sources
        - --list-services
        - --list-ports
        - --list-protocols
        - --list-source-ports
        - --list-forward-ports
        - --list-icmp-blocks
        - --list-rich-rules
        - --query-forward
        - --query-masquerade
        - --query-icmp-block-inversion
      register: system_maintenance_molecule_baseline_permanent_firewall
      changed_when: false
      failed_when: system_maintenance_molecule_baseline_permanent_firewall.rc not in [0, 1]
      no_log: true

    - name: Read permanent direct firewall openings
      ansible.builtin.command:
        argv:
          - /usr/bin/firewall-offline-cmd
          - --direct
          - "{{ item }}"
      loop:
        - --get-all-chains
        - --get-all-rules
        - --get-all-passthroughs
      register: system_maintenance_molecule_baseline_direct_firewall
      changed_when: false
      no_log: true

    - name: Read permanent global firewall zone bindings
      ansible.builtin.command:
        argv: [/usr/bin/firewall-offline-cmd, --list-all-zones]
      register: system_maintenance_molecule_baseline_firewall_bindings
      changed_when: false
      no_log: true

    - name: Read permanent firewalld policy objects
      ansible.builtin.command:
        argv: [/usr/bin/firewall-offline-cmd, --list-all-policies]
      register: system_maintenance_molecule_baseline_firewall_policies
      changed_when: false
      no_log: true

    - name: Verify permanent private-management firewall policy
      vars:
        system_maintenance_molecule_baseline_firewall_problems: >-
          {{ system_maintenance_molecule_baseline_firewalld_configuration.content
             | b64decode
             | system_maintenance_molecule_baseline_firewall_errors(
                 system_maintenance_molecule_baseline_permanent_firewall.results,
                 system_maintenance_molecule_baseline_direct_firewall.results,
                 system_maintenance_molecule_baseline_firewall_bindings.stdout,
                 system_maintenance_molecule_baseline_firewall_policies.stdout,
                 reverse_proxy_client_sources) }}
      ansible.builtin.assert:
        that:
          - system_maintenance_molecule_baseline_firewall_problems | length == 0
        fail_msg: Permanent homelab firewall policy is not exact
      no_log: true

    - name: Read Debian AppArmor configuration evidence
      ansible.builtin.slurp:
        src: /etc/apparmor/parser.conf
      register: system_maintenance_molecule_baseline_apparmor_configuration

    - name: Verify Debian MAC and time provider packages
      ansible.builtin.assert:
        that:
          - "'apparmor' in ansible_facts.packages"
          - "'systemd-timesyncd' in ansible_facts.packages"
          - system_maintenance_molecule_baseline_apparmor_configuration.content | b64decode | length > 0

    - name: Read effective journald configuration
      ansible.builtin.command:
        argv: [/usr/bin/systemd-analyze, cat-config, systemd/journald.conf]
      register: system_maintenance_molecule_baseline_journald_configuration
      changed_when: false

    - name: Read auditd configuration
      ansible.builtin.slurp:
        src: /etc/audit/auditd.conf
      register: system_maintenance_molecule_baseline_auditd_configuration

    - name: Verify persistent bounded journald and auditd evidence
      ansible.builtin.assert:
        that:
          - "'Storage=persistent' in system_maintenance_molecule_baseline_journald_configuration.stdout"
          - "'SystemMaxUse=512M' in system_maintenance_molecule_baseline_journald_configuration.stdout"
          - "'SystemKeepFree=1G' in system_maintenance_molecule_baseline_journald_configuration.stdout"
          - system_maintenance_molecule_baseline_auditd_configuration.content | b64decode | length > 0
          - "'auditd' in ansible_facts.packages"

    - name: Read Debian unattended-upgrades policy
      ansible.builtin.command:
        argv: [/usr/bin/apt-config, dump]
      register: system_maintenance_molecule_baseline_debian_updater
      changed_when: false

    - name: Read native security updater timer configuration
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-analyze
          - cat-config
          - systemd/system/apt-daily-upgrade.timer
      register: system_maintenance_molecule_baseline_updater_timer
      changed_when: false

    - name: Read native security updater timer enablement
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-enabled
          - apt-daily-upgrade.timer
      register: system_maintenance_molecule_baseline_updater_timer_enabled
      changed_when: false

    - name: Verify native security updater policy and timer
      vars:
        system_maintenance_molecule_baseline_updater_problems: >-
          {{ system_maintenance_molecule_baseline_debian_updater.stdout
             | system_maintenance_molecule_baseline_debian_updater_errors(
                 system_maintenance_molecule_baseline_updater_timer.stdout,
                 system_maintenance_molecule_baseline_updater_timer_enabled.stdout) }}
      ansible.builtin.assert:
        that:
          - system_maintenance_molecule_baseline_updater_problems | length == 0

    - name: Verify baseline packages and the Caddy package source
      ansible.builtin.assert:
        that:
          - system_maintenance_molecule_baseline_minimum_packages | difference(ansible_facts.packages.keys()) | length == 0
          - "'caddy' in ansible_facts.packages"
          - "'fail2ban' not in ansible_facts.packages"

    - name: Inspect recurring full update timer and cron artifacts
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ system_maintenance_molecule_baseline_recurring_full_update_artifacts }}"
      register: system_maintenance_molecule_baseline_full_update_artifacts

    - name: Verify no recurring full update artifacts exist
      ansible.builtin.assert:
        that:
          - system_maintenance_molecule_baseline_full_update_artifacts.results | selectattr('stat.exists') | list | length == 0
        fail_msg: A recurring host-local full update artifact exists

    - name: State the container evidence boundary
      ansible.builtin.debug:
        msg: >-
          Container evidence does not prove runtime clock synchronization,
          firewall reachability, kernel enforcement, audit-kernel attachment,
          or physical reboot behavior.
      changed_when: false

- name: Verify synthetic Podman identities and Quadlet generation
  hosts: os_managed
  gather_facts: true
  become: true
  vars_files:
    - vars/podman.yml
  tasks:
    - name: Read effective subordinate allocation files
      ansible.builtin.slurp:
        src: "/etc/sub{{ item }}"
      loop: [uid, gid]
      register: system_maintenance_molecule_subids

    - name: Verify exact service ranges and preservation of unrelated allocations
      ansible.builtin.assert:
        that:
          - "'svc-fixture-a:200000:65536' in (item.content | b64decode).splitlines()"
          - "'svc-fixture-b:300000:65536' in (item.content | b64decode).splitlines()"
          - "'svc-fixture-unmanaged:500000:65536' in (item.content | b64decode).splitlines()"
      loop: "{{ system_maintenance_molecule_subids.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Observe the foundation using its standalone verifier tasks
      ansible.builtin.import_role:
        name: podman_foundation
        tasks_from: verify.yml

    - name: Prove each service can enter its own home
      ansible.builtin.command:
        argv: [/usr/sbin/runuser, -u, "{{ item }}", --, /usr/bin/test, -x, "/var/lib/{{ item }}"]
      loop: [svc-fixture-a, svc-fixture-b]
      changed_when: false

    - name: Prove service accounts cannot enter the other service home
      ansible.builtin.command:
        argv: [/usr/sbin/runuser, -u, "{{ item.user }}", --, /usr/bin/test, -x, "{{ item.path }}"]
      loop:
        - {user: svc-fixture-a, path: /var/lib/svc-fixture-b}
        - {user: svc-fixture-b, path: /var/lib/svc-fixture-a}
      register: system_maintenance_molecule_podman_cross_access
      failed_when: system_maintenance_molecule_podman_cross_access.rc != 1
      changed_when: false

    - name: Prove the service cannot modify its administrator-owned Quadlet
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - -u
          - svc-fixture-a
          - --
          - /usr/bin/test
          - -w
          - /etc/containers/systemd/users/2001/foundation-fixture.container
      register: system_maintenance_molecule_podman_definition_write
      failed_when: system_maintenance_molecule_podman_definition_write.rc != 1
      changed_when: false

    - name: Generate the synthetic rootless service without starting a container
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - -u
          - svc-fixture-a
          - --
          - /usr/bin/env
          - QUADLET_UNIT_DIRS=/etc/containers/systemd/users/2001
          - /usr/lib/systemd/system-generators/podman-system-generator
          - --user
          - --dryrun
      register: system_maintenance_molecule_podman_generated_fixture
      changed_when: false

    - name: Verify the installed generator produced the expected rootless service
      ansible.builtin.assert:
        that:
          - "'foundation-fixture.service' in system_maintenance_molecule_podman_generated_fixture.stdout"
          - "'docker.io/library/alpine:3.22.1' in system_maintenance_molecule_podman_generated_fixture.stdout"
          - "'ExecStart=' in system_maintenance_molecule_podman_generated_fixture.stdout"

    - name: Exercise permission drift detection in disposable state
      block:
        - name: Introduce a temporary service-home permission error
          ansible.builtin.file:
            path: /var/lib/svc-fixture-a
            mode: '0755'

        - name: Observe private home drift
          ansible.builtin.include_role:
            name: podman_foundation
            tasks_from: verify.yml
      rescue:
        - name: Record expected directory permission failure
          ansible.builtin.assert:
            that: ansible_failed_task.name == 'Verify directory ownership and permissions'
      always:
        - name: Restore the synthetic private home
          ansible.builtin.file:
            path: /var/lib/svc-fixture-a
            mode: '0700'

    - name: Require the verifier to have detected drift
      ansible.builtin.assert:
        that: ansible_failed_task.name | default('') == 'Verify directory ownership and permissions'

    - name: Verify restored synthetic foundation
      ansible.builtin.import_role:
        name: podman_foundation
        tasks_from: verify.yml

- name: Verify the OS baseline through the standalone operator playbook
  ansible.builtin.import_playbook: ../../../../playbooks/os/verify.yml
  vars:
    host_identity_hostname: "molecule-{{ inventory_hostname }}"
    host_identity_timezone: Etc/UTC
    os_baseline_verify_runtime_controls: false
    security_baseline_authorized_keys:
      - >-
        {{ lookup('ansible.builtin.file',
           molecule_ephemeral_directory ~ '/controller-key/id_ed25519.pub') | trim }}
    security_baseline_management_sources:
      - 10.0.0.0/8
    os_baseline_verify_sshd_connection_context:
      host: 127.0.0.1
      peer: 127.0.0.1
      local_address: 127.0.0.1
      local_port: 22
    system_maintenance_native_reboot_enabled: false

- name: Verify disabled off-cluster TLS capability and distro runtime
  hosts: os_managed
  gather_facts: true
  become: true
  vars_files:
    - vars/tls.yml
  tasks:
    - name: Discover the independently observed disposable TLS address
      ansible.builtin.include_tasks: tasks/tls-address.yml

    - name: Read the installed Caddy certificate reader group
      ansible.builtin.command:
        argv: [/usr/bin/getent, group, caddy]
      register: system_maintenance_molecule_caddy_group
      changed_when: false

    - name: Record the installed Caddy certificate reader ID
      ansible.builtin.set_fact:
        system_maintenance_molecule_caddy_gid: "{{ system_maintenance_molecule_caddy_group.stdout.split(':')[2] | int }}"

    - name: Gather installed package evidence
      ansible.builtin.package_facts:
        manager: auto

    - name: Read effective issuer identity
      ansible.builtin.command:
        argv: [/usr/bin/getent, passwd, svc-acme]
      register: system_maintenance_molecule_tls_passwd
      changed_when: false

    - name: Read effective issuer group
      ansible.builtin.command:
        argv: [/usr/bin/getent, group, svc-acme]
      register: system_maintenance_molecule_tls_group
      changed_when: false

    - name: Read issuer supplementary groups
      ansible.builtin.command:
        argv: [/usr/bin/id, -G, svc-acme]
      register: system_maintenance_molecule_tls_groups
      changed_when: false

    - name: Read issuer password lock
      ansible.builtin.command:
        argv: [/usr/bin/getent, shadow, svc-acme]
      register: system_maintenance_molecule_tls_shadow
      changed_when: false
      no_log: true

    - name: Verify TLS packages and isolated issuer identity
      ansible.builtin.assert:
        that:
          - "'python3' in ansible_facts.packages"
          - "'python3-cryptography' in ansible_facts.packages"
          - "'openssl' in ansible_facts.packages"
          - "'ca-certificates' in ansible_facts.packages"
          - system_maintenance_molecule_tls_passwd.stdout.split(':')[2] == '2010'
          - system_maintenance_molecule_tls_passwd.stdout.split(':')[3] == '2010'
          - system_maintenance_molecule_tls_passwd.stdout.split(':')[5] == '/var/lib/homelab-tls-issuer'
          - system_maintenance_molecule_tls_passwd.stdout.split(':')[6] in ['/usr/sbin/nologin', '/sbin/nologin']
          - system_maintenance_molecule_tls_group.stdout.split(':')[2] == '2010'
          - system_maintenance_molecule_tls_group.stdout.split(':')[3] == ''
          - system_maintenance_molecule_tls_groups.stdout | trim == '2010'
          - system_maintenance_molecule_tls_shadow.stdout.split(':')[1] is match('^[!*]')

    - name: Inspect installed TLS filesystem boundaries
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop:
        - {path: /etc/homelab-tls, mode: '0750', uid: 0, gid: 2010, type: directory}
        - {path: /etc/homelab-tls/config.json, mode: '0640', uid: 0, gid: 2010, type: file}
        - {path: /etc/homelab-tls/.issuer-account.json, mode: '0644', uid: 0, gid: 0, type: file}
        - {path: /var/lib/homelab-tls, mode: '0750', uid: 0, gid: "{{ system_maintenance_molecule_caddy_gid }}", type: directory}
        - {path: /var/lib/homelab-tls/private, mode: '0700', uid: 0, gid: 0, type: directory}
        - {path: /var/lib/homelab-tls/private/coordinator.lock, mode: '0600', uid: 0, gid: 0, type: file}
        - {path: /etc/caddy/tls/infra, mode: '0750', uid: 0, gid: "{{ system_maintenance_molecule_caddy_gid }}", type: directory}
        - {path: /etc/caddy/tls/.homelab-tls-private, mode: '0700', uid: 0, gid: 0, type: directory}
        - {path: /var/lib/homelab-tls-issuer, mode: '0700', uid: 2010, gid: 2010, type: directory}
        - {path: /usr/local/lib/homelab-tls, mode: '0755', uid: 0, gid: 0, type: directory}
        - {path: /usr/local/lib/homelab-tls/tls_runtime, mode: '0755', uid: 0, gid: 0, type: directory}
        - {path: /usr/local/lib/homelab-tls/tls_runtime/__init__.py, mode: '0644', uid: 0, gid: 0, type: file}
        - {path: /usr/local/lib/homelab-tls/tls_runtime/certificates.py, mode: '0644', uid: 0, gid: 0, type: file}
        - {path: /usr/local/lib/homelab-tls/tls_runtime/policy.py, mode: '0644', uid: 0, gid: 0, type: file}
        - {path: /usr/local/lib/homelab-tls/tls_runtime/publication.py, mode: '0644', uid: 0, gid: 0, type: file}
        - {path: /usr/local/lib/homelab-tls/tls_runtime/unit_contract.py, mode: '0644', uid: 0, gid: 0, type: file}
        - {path: /usr/local/lib/homelab-tls/tls_runtime/runtime.py, mode: '0644', uid: 0, gid: 0, type: file}
        - {path: /usr/local/lib/homelab-tls/tls_runtime/caddy.py, mode: '0644', uid: 0, gid: 0, type: file}
        - {path: /usr/local/libexec/homelab-tls-issue, mode: '0755', uid: 0, gid: 0, type: file}
        - {path: /usr/local/libexec/homelab-tls-reconcile, mode: '0755', uid: 0, gid: 0, type: file}
        - {path: /usr/local/libexec/homelab-tls-verify, mode: '0755', uid: 0, gid: 0, type: file}
        - {path: /usr/local/libexec/homelab-tls-caddy, mode: '0755', uid: 0, gid: 0, type: file}
        - {path: /usr/local/libexec/lego-5.4.1, mode: '0755', uid: 0, gid: 0, type: file}
        - {path: /etc/systemd/system/homelab-tls-issuer.service, mode: '0644', uid: 0, gid: 0, type: file}
        - {path: /etc/systemd/system/homelab-tls-renew.service, mode: '0644', uid: 0, gid: 0, type: file}
        - {path: /etc/systemd/system/homelab-tls-renew.timer, mode: '0644', uid: 0, gid: 0, type: file}
      loop_control:
        label: "{{ item.path }}"
      register: system_maintenance_molecule_tls_paths

    - name: Verify exact TLS filesystem ownership and modes
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - not item.stat.islnk
          - item.stat.uid == item.item.uid
          - item.stat.gid == item.item.gid
          - item.stat.mode == item.item.mode
          - item.stat.isdir if item.item.type == 'directory' else item.stat.isreg
      loop: "{{ system_maintenance_molecule_tls_paths.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Inspect omitted credential
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop:
        - /etc/homelab-tls/cloudflare-token
      register: system_maintenance_molecule_tls_absent_inputs

    - name: Verify omitted private input remains absent
      ansible.builtin.assert:
        that:
          - system_maintenance_molecule_tls_absent_inputs.results | selectattr('stat.exists') | list | length == 0

    - name: Read installed public TLS policy
      ansible.builtin.slurp:
        src: /etc/homelab-tls/config.json
      register: system_maintenance_molecule_tls_policy

    - name: Read installed issuer allocation marker
      ansible.builtin.slurp:
        src: /etc/homelab-tls/.issuer-account.json
      register: system_maintenance_molecule_tls_marker

    - name: Verify exact public policy and account marker
      ansible.builtin.assert:
        that:
          - >-
            system_maintenance_molecule_tls_policy.content | b64decode | from_json ==
            {'namespace': 'infra.example.com', 'email': 'acme@example.com',
             'reader_gid': system_maintenance_molecule_caddy_gid,
             'endpoints': [{'hostname': 'modem.infra.example.com',
                            'address': system_maintenance_molecule_tls_address, 'port': 443}]}
          - >-
            system_maintenance_molecule_tls_marker.content | b64decode | from_json ==
            {'name': 'svc-acme', 'uid': 2010, 'gid': 2010}

    - name: Exercise unmanaged issuer adoption rejection in disposable state
      block:
        - name: Temporarily remove the issuer allocation marker
          ansible.builtin.file:
            path: /etc/homelab-tls/.issuer-account.json
            state: absent

        - name: Run TLS preflight against the unmarked existing account
          ansible.builtin.include_role:
            name: tls_automation
            tasks_from: preflight.yml
      rescue:
        - name: Record the expected account adoption failure
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Validate effective issuer allocation'

        - name: Record successful adoption rejection
          ansible.builtin.set_fact:
            system_maintenance_molecule_tls_adoption_rejected: true
      always:
        - name: Restore the issuer allocation marker
          ansible.builtin.copy:
            content: "{{ system_maintenance_molecule_tls_marker.content | b64decode }}"
            dest: /etc/homelab-tls/.issuer-account.json
            owner: root
            group: root
            mode: '0644'
          no_log: true
          diff: false

    - name: Require preflight to reject unmarked account adoption
      ansible.builtin.assert:
        that:
          - system_maintenance_molecule_tls_adoption_rejected | default(false)

    - name: Exercise keyed NSS UID collision rejection
      block:
        - name: Validate a hidden UID collision against synthetic keyed records
          ansible.builtin.set_fact:
            system_maintenance_molecule_tls_hidden_uid_result: >-
              {{ {'name': 'svc-acme', 'uid': 2010, 'gid': 2010}
                 | tls_automation_validate_identity('', '', '', [
                   {'item': {'name': 'user_name'}, 'rc': 2, 'stdout': ''},
                   {'item': {'name': 'user_uid'}, 'rc': 0,
                    'stdout': 'svc-hidden:x:2010:3010::/nonexistent:/usr/sbin/nologin'},
                   {'item': {'name': 'group_name'}, 'rc': 2, 'stdout': ''},
                   {'item': {'name': 'group_gid'}, 'rc': 2, 'stdout': ''}
                 ]) }}
      rescue:
        - name: Record hidden UID collision rejection
          ansible.builtin.set_fact:
            system_maintenance_molecule_tls_hidden_uid_rejected: true

    - name: Exercise keyed NSS GID collision rejection
      block:
        - name: Validate a hidden GID collision against synthetic keyed records
          ansible.builtin.set_fact:
            system_maintenance_molecule_tls_hidden_gid_result: >-
              {{ {'name': 'svc-acme', 'uid': 2010, 'gid': 2010}
                 | tls_automation_validate_identity('', '', '', [
                   {'item': {'name': 'user_name'}, 'rc': 2, 'stdout': ''},
                   {'item': {'name': 'user_uid'}, 'rc': 2, 'stdout': ''},
                   {'item': {'name': 'group_name'}, 'rc': 2, 'stdout': ''},
                   {'item': {'name': 'group_gid'}, 'rc': 0, 'stdout': 'svc-hidden:x:2010:'}
                 ]) }}
      rescue:
        - name: Record hidden GID collision rejection
          ansible.builtin.set_fact:
            system_maintenance_molecule_tls_hidden_gid_rejected: true

    - name: Require keyed NSS collision rejection
      ansible.builtin.assert:
        that:
          - system_maintenance_molecule_tls_hidden_uid_rejected | default(false)
          - system_maintenance_molecule_tls_hidden_gid_rejected | default(false)

    - name: Parse installed systemd unit definitions
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-analyze
          - verify
          - /etc/systemd/system/homelab-tls-issuer.service
          - /etc/systemd/system/homelab-tls-renew.service
          - /etc/systemd/system/homelab-tls-renew.timer
      changed_when: false

    - name: Read effective TLS service properties
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - "{{ item }}"
          - --property=User,Group,SupplementaryGroups,Type,NoNewPrivileges,ProtectSystem,PrivateTmp,ReadWritePaths,FragmentPath,DropInPaths
      loop:
        - homelab-tls-issuer.service
        - homelab-tls-renew.service
      register: system_maintenance_molecule_tls_services
      changed_when: false

    - name: Verify effective issuer service boundary
      ansible.builtin.assert:
        that:
          - "'User=svc-acme' in system_maintenance_molecule_tls_services.results[0].stdout_lines"
          - "'Group=svc-acme' in system_maintenance_molecule_tls_services.results[0].stdout_lines"
          - "'SupplementaryGroups=' in system_maintenance_molecule_tls_services.results[0].stdout_lines"
          - "'Type=oneshot' in system_maintenance_molecule_tls_services.results[0].stdout_lines"
          - "'NoNewPrivileges=yes' in system_maintenance_molecule_tls_services.results[0].stdout_lines"
          - "'ProtectSystem=strict' in system_maintenance_molecule_tls_services.results[0].stdout_lines"
          - "'PrivateTmp=yes' in system_maintenance_molecule_tls_services.results[0].stdout_lines"
          - "'ReadWritePaths=/var/lib/homelab-tls-issuer' in system_maintenance_molecule_tls_services.results[0].stdout_lines"
          - "'FragmentPath=/etc/systemd/system/homelab-tls-issuer.service' in system_maintenance_molecule_tls_services.results[0].stdout_lines"
          - "'DropInPaths=' in system_maintenance_molecule_tls_services.results[0].stdout_lines"

    - name: Verify effective root coordinator service boundary
      ansible.builtin.assert:
        that:
          - "'User=root' in system_maintenance_molecule_tls_services.results[1].stdout_lines"
          - "'Group=root' in system_maintenance_molecule_tls_services.results[1].stdout_lines"
          - "'SupplementaryGroups=' in system_maintenance_molecule_tls_services.results[1].stdout_lines"
          - "'Type=oneshot' in system_maintenance_molecule_tls_services.results[1].stdout_lines"
          - "'NoNewPrivileges=yes' in system_maintenance_molecule_tls_services.results[1].stdout_lines"
          - "'ProtectSystem=strict' in system_maintenance_molecule_tls_services.results[1].stdout_lines"
          - "'PrivateTmp=yes' in system_maintenance_molecule_tls_services.results[1].stdout_lines"
          - >-
            'ReadWritePaths=/var/lib/homelab-tls /etc/caddy /var/lib/homelab-reverse-proxy'
            in system_maintenance_molecule_tls_services.results[1].stdout_lines
          - "'FragmentPath=/etc/systemd/system/homelab-tls-renew.service' in system_maintenance_molecule_tls_services.results[1].stdout_lines"
          - "'DropInPaths=' in system_maintenance_molecule_tls_services.results[1].stdout_lines"

    - name: Read effective TLS unit configuration
      ansible.builtin.command:
        argv: [/usr/bin/systemd-analyze, cat-config, "systemd/system/{{ item }}"]
      loop:
        - homelab-tls-issuer.service
        - homelab-tls-renew.service
        - homelab-tls-renew.timer
      register: system_maintenance_molecule_tls_unit_configuration
      changed_when: false

    - name: Verify fixed commands, credential mapping, and timer schedule
      ansible.builtin.assert:
        that:
          - "'ExecStart=/usr/local/libexec/homelab-tls-issue' in system_maintenance_molecule_tls_unit_configuration.results[0].stdout_lines"
          - "'LoadCredential=cloudflare-token:/etc/homelab-tls/cloudflare-token' in system_maintenance_molecule_tls_unit_configuration.results[0].stdout_lines"
          - "'TimeoutStartSec=15min' in system_maintenance_molecule_tls_unit_configuration.results[0].stdout_lines"
          - "'ExecStart=/usr/local/libexec/homelab-tls-reconcile' in system_maintenance_molecule_tls_unit_configuration.results[1].stdout_lines"
          - "'TimeoutStartSec=1h' in system_maintenance_molecule_tls_unit_configuration.results[1].stdout_lines"
          - "'OnCalendar=*-*-* 00,12:00:00' in system_maintenance_molecule_tls_unit_configuration.results[2].stdout_lines"
          - "'RandomizedDelaySec=1h' in system_maintenance_molecule_tls_unit_configuration.results[2].stdout_lines"
          - "'Persistent=true' in system_maintenance_molecule_tls_unit_configuration.results[2].stdout_lines"

    - name: Exercise runtime control drop-in rejection
      block:
        - name: Create a disposable runtime control drop-in directory
          ansible.builtin.file:
            path: /run/systemd/system.control/homelab-tls-renew.service.d
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Install a weakening runtime control drop-in
          ansible.builtin.copy:
            dest: /run/systemd/system.control/homelab-tls-renew.service.d/override.conf
            owner: root
            group: root
            mode: '0644'
            content: |
              [Service]
              NoNewPrivileges=no

        - name: Reload systemd with the disposable runtime control drop-in
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Run TLS preflight against the runtime control drop-in
          ansible.builtin.include_role:
            name: tls_automation
            tasks_from: preflight.yml
      rescue:
        - name: Verify effective-unit rejection caught the runtime control drop-in
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Require safe effective TLS units'

        - name: Record runtime control drop-in rejection
          ansible.builtin.set_fact:
            system_maintenance_molecule_tls_control_dropin_rejected: true
      always:
        - name: Remove the disposable runtime control drop-in
          ansible.builtin.file:
            path: /run/systemd/system.control/homelab-tls-renew.service.d
            state: absent

        - name: Reload systemd after runtime control drop-in cleanup
          ansible.builtin.systemd_service:
            daemon_reload: true

    - name: Require runtime control drop-in rejection
      ansible.builtin.assert:
        that:
          - system_maintenance_molecule_tls_control_dropin_rejected | default(false)

    - name: Exercise loaded transient templated-instance rejection
      block:
        - name: Start a disposable transient templated instance
          ansible.builtin.command:
            argv:
              - /usr/bin/systemd-run
              - --unit=homelab-tls-renew@fixture.service
              - --collect
              - --property=Type=oneshot
              - --property=RemainAfterExit=yes
              - /usr/bin/true
          changed_when: true

        - name: Run TLS preflight against the loaded templated instance
          ansible.builtin.include_role:
            name: tls_automation
            tasks_from: preflight.yml
      rescue:
        - name: Verify loaded-unit rejection caught the templated instance
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Reject templated TLS unit instances'

        - name: Record loaded templated-instance rejection
          ansible.builtin.set_fact:
            system_maintenance_molecule_tls_instance_rejected: true
      always:
        - name: Stop and collect the disposable templated instance
          ansible.builtin.systemd_service:
            name: homelab-tls-renew@fixture.service
            state: stopped

    - name: Require loaded templated-instance rejection
      ansible.builtin.assert:
        that:
          - system_maintenance_molecule_tls_instance_rejected | default(false)

    - name: Exercise systemd credential metadata with synthetic input
      block:
        - name: Install the metadata-only credential probe
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../../../tests/tls/credential_probe.py"
            dest: /usr/local/lib/homelab-tls/credential_probe.py
            owner: root
            group: root
            mode: '0644'

        - name: Create an obvious synthetic credential source
          ansible.builtin.copy:
            content: molecule-not-a-live-token
            dest: /run/homelab-tls-fixture-token
            owner: root
            group: root
            mode: '0600'
          diff: false

        - name: Observe systemd LoadCredential metadata as the issuer account
          ansible.builtin.command:
            argv:
              - /usr/bin/systemd-run
              - --unit=homelab-tls-fixture-credential
              - --wait
              - --pipe
              - --collect
              - --property=User=svc-acme
              - --property=Group=svc-acme
              - --property=NoNewPrivileges=yes
              - --property=LoadCredential=cloudflare-token:/run/homelab-tls-fixture-token
              - /usr/bin/python3
              - -I
              - /usr/local/lib/homelab-tls/credential_probe.py
          register: system_maintenance_molecule_tls_credential_probe
          changed_when: false

        - name: Report credential metadata for runtime evidence
          ansible.builtin.debug:
            msg: >-
              {{ system_maintenance_molecule_tls_credential_probe.stdout_lines[-1] | from_json }}

        - name: Verify effective systemd credential access boundary
          vars:
            system_maintenance_molecule_tls_credential_metadata: >-
              {{ system_maintenance_molecule_tls_credential_probe.stdout_lines[-1] | from_json }}
            system_maintenance_molecule_tls_credential_file_acl:
              - {tag: 1, permissions: 4, id: 4294967295}
              - {tag: 2, permissions: 4, id: 2010}
              - {tag: 4, permissions: 0, id: 4294967295}
              - {tag: 16, permissions: 4, id: 4294967295}
              - {tag: 32, permissions: 0, id: 4294967295}
            system_maintenance_molecule_tls_credential_directory_acl:
              - {tag: 1, permissions: 5, id: 4294967295}
              - {tag: 2, permissions: 5, id: 2010}
              - {tag: 4, permissions: 0, id: 4294967295}
              - {tag: 16, permissions: 5, id: 4294967295}
              - {tag: 32, permissions: 0, id: 4294967295}
          ansible.builtin.assert:
            that:
              - system_maintenance_molecule_tls_credential_metadata.process_uid == 2010
              - system_maintenance_molecule_tls_credential_metadata.process_gid == 2010
              - system_maintenance_molecule_tls_credential_metadata.credential.regular
              - not system_maintenance_molecule_tls_credential_metadata.credential.directory
              - >-
                system_maintenance_molecule_tls_credential_metadata.credential.mode
                is match('^0[0-7][0-5][0-5]$')
              - system_maintenance_molecule_tls_credential_metadata.credential.links == 1
              - >-
                (system_maintenance_molecule_tls_credential_metadata.credential.uid == 0 and
                 system_maintenance_molecule_tls_credential_metadata.credential.gid == 0 and
                 system_maintenance_molecule_tls_credential_metadata.credential.mode == '0440' and
                 system_maintenance_molecule_tls_credential_metadata.credential.acl ==
                 system_maintenance_molecule_tls_credential_file_acl) or
                (system_maintenance_molecule_tls_credential_metadata.credential.uid == 2010 and
                 system_maintenance_molecule_tls_credential_metadata.credential.gid in [0, 2010] and
                 system_maintenance_molecule_tls_credential_metadata.credential.mode == '0400' and
                 system_maintenance_molecule_tls_credential_metadata.credential.acl is none and
                 system_maintenance_molecule_tls_credential_metadata.credential.filesystem_readonly)
              - system_maintenance_molecule_tls_credential_metadata.parent.directory
              - not system_maintenance_molecule_tls_credential_metadata.parent.regular
              - >-
                system_maintenance_molecule_tls_credential_metadata.credential.uid ==
                system_maintenance_molecule_tls_credential_metadata.parent.uid
              - >-
                system_maintenance_molecule_tls_credential_metadata.credential.gid ==
                system_maintenance_molecule_tls_credential_metadata.parent.gid
              - >-
                system_maintenance_molecule_tls_credential_metadata.parent.mode
                is match('^0[0-7][0-5][0-5]$')
              - >-
                (system_maintenance_molecule_tls_credential_metadata.parent.uid == 0 and
                 system_maintenance_molecule_tls_credential_metadata.parent.gid == 0 and
                 system_maintenance_molecule_tls_credential_metadata.parent.mode == '0550' and
                 system_maintenance_molecule_tls_credential_metadata.parent.acl ==
                 system_maintenance_molecule_tls_credential_directory_acl) or
                (system_maintenance_molecule_tls_credential_metadata.parent.uid == 2010 and
                 system_maintenance_molecule_tls_credential_metadata.parent.gid in [0, 2010] and
                 system_maintenance_molecule_tls_credential_metadata.parent.mode == '0500' and
                 system_maintenance_molecule_tls_credential_metadata.parent.acl is none and
                 system_maintenance_molecule_tls_credential_metadata.parent.filesystem_readonly)
              - system_maintenance_molecule_tls_credential_metadata.credential_root.directory
              - system_maintenance_molecule_tls_credential_metadata.credential_root.uid == 0
              - system_maintenance_molecule_tls_credential_metadata.credential_root.gid == 0
              - system_maintenance_molecule_tls_credential_metadata.credential_root.mode == '0755'
      always:
        - name: Remove synthetic credential evidence files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /run/homelab-tls-fixture-token
            - /usr/local/lib/homelab-tls/credential_probe.py

    - name: Read pinned lego version
      ansible.builtin.command:
        argv: [/usr/local/libexec/lego-5.4.1, --version]
      register: system_maintenance_molecule_tls_lego_version
      changed_when: false

    - name: Verify pinned lego release
      ansible.builtin.assert:
        that:
          - system_maintenance_molecule_tls_lego_version.stdout is search('version 5.4.1')

    - name: Read disabled renewal timer state
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-enabled, homelab-tls-renew.timer]
      register: system_maintenance_molecule_tls_timer_enabled
      changed_when: false
      failed_when: false

    - name: Read inactive renewal timer state
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-active, homelab-tls-renew.timer]
      register: system_maintenance_molecule_tls_timer_active
      changed_when: false
      failed_when: false

    - name: Read issuer state before missing-credential preflight
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, show, homelab-tls-issuer.service, --property=ActiveState, --value]
      register: system_maintenance_molecule_tls_issuer_before
      changed_when: false

    - name: Exercise runtime preflight without a credential
      ansible.builtin.command:
        argv: [/usr/local/libexec/homelab-tls-reconcile]
      register: system_maintenance_molecule_tls_preflight
      changed_when: false
      failed_when: false

    - name: Read issuer state after missing-credential preflight
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, show, homelab-tls-issuer.service, --property=ActiveState, --value]
      register: system_maintenance_molecule_tls_issuer_after
      changed_when: false

    - name: Verify disabled and fail-closed behavior
      ansible.builtin.assert:
        that:
          - system_maintenance_molecule_tls_timer_enabled.rc != 0
          - system_maintenance_molecule_tls_timer_enabled.stdout | trim == 'disabled'
          - system_maintenance_molecule_tls_timer_active.rc != 0
          - system_maintenance_molecule_tls_timer_active.stdout | trim == 'inactive'
          - system_maintenance_molecule_tls_preflight.rc == 1
          - system_maintenance_molecule_tls_issuer_before.stdout | trim == 'inactive'
          - system_maintenance_molecule_tls_issuer_after.stdout | trim == 'inactive'

    - name: Test manual renewal waiting for successful and failed existing jobs
      ansible.builtin.include_tasks: tasks/tls-manual-wait.yml
      loop: [0, 7]
      loop_control:
        loop_var: system_maintenance_molecule_tls_wait_exit_code

    - name: Create disposable installed-runtime test root
      ansible.builtin.tempfile:
        state: directory
        prefix: homelab-tls-evidence-
      register: system_maintenance_molecule_tls_test_root

    - name: Exercise installed TLS runtime with distribution Python
      block:
        - name: Create disposable repository-shaped test directories
          ansible.builtin.file:
            path: "{{ system_maintenance_molecule_tls_test_root.path }}/{{ item }}"
            state: directory
            mode: '0755'
          loop:
            - tests/tls
            - tests/ansible
            - roles/tls_automation/files
            - roles/reverse_proxy/files
            - roles/reverse_proxy/filter_plugins

        - name: Link the installed runtime into the disposable test tree
          ansible.builtin.file:
            src: /usr/local/lib/homelab-tls/tls_runtime
            dest: "{{ system_maintenance_molecule_tls_test_root.path }}/roles/tls_automation/files/tls_runtime"
            state: link

        - name: Copy the secret-free TLS unit tests into disposable state
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../../../tests/tls/"
            dest: "{{ system_maintenance_molecule_tls_test_root.path }}/tests/tls/"
            mode: preserve

        - name: Link installed proxy modules into the disposable test tree
          ansible.builtin.file:
            src: "{{ item.source }}"
            dest: "{{ system_maintenance_molecule_tls_test_root.path }}/{{ item.destination }}"
            state: link
          loop:
            - source: /usr/local/libexec/homelab-reverse-proxy
              destination: roles/reverse_proxy/files/activate.py
            - source: /usr/local/lib/homelab-reverse-proxy/proxy_manifest.py
              destination: roles/reverse_proxy/files/manifest.py
            - source: /usr/local/lib/homelab-reverse-proxy/proxy_config.py
              destination: roles/reverse_proxy/filter_plugins/proxy.py

        - name: Copy the bounded proxy fixtures used by TLS integration tests
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../../../tests/ansible/{{ item }}"
            dest: "{{ system_maintenance_molecule_tls_test_root.path }}/tests/ansible/{{ item }}"
            mode: '0644'
          loop:
            - test_reverse_proxy_activation.py
            - test_proxy_manifest_runtime.py

        - name: Run TLS tests with distribution Python and cryptography
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -m
              - unittest
              - discover
              - -s
              - "{{ system_maintenance_molecule_tls_test_root.path }}/tests/tls"
              - -p
              - test_*.py
              - -v
          changed_when: false
      always:
        - name: Remove disposable TLS test state
          ansible.builtin.file:
            path: "{{ system_maintenance_molecule_tls_test_root.path }}"
            state: absent
