---
- name: Confirm installer-provided access before Python bootstrap
  hosts: os_managed
  gather_facts: false
  become: false
  tasks:
    - name: Verify the Python-less installer boundary
      ansible.builtin.raw: |
        set -eu
        test "$(id -un)" = ansible
        sudo -n true
        . /etc/os-release
        test "${ID}" = debian
        ! command -v python3 >/dev/null 2>&1
      args:
        executable: /bin/sh
      changed_when: false
