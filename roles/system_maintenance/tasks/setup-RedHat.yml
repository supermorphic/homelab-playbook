---
- name: Install package-management utilities
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
    update_cache: true

- name: Retain the two most recent kernels
  community.general.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: installonly_limit
    value: '2'
    no_extra_spaces: true
    mode: '0644'

- name: Fully update installed packages
  ansible.builtin.dnf:
    name: '*'
    state: latest
    update_cache: true
    update_only: true

- name: Remove unneeded packages
  ansible.builtin.dnf:
    autoremove: true
    state: absent

- name: Install EPEL release package
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Disable EPEL repository by default
  community.general.ini_file:
    path: /etc/yum.repos.d/epel.repo
    section: epel
    option: enabled
    value: '0'
    no_extra_spaces: true
    mode: '0644'
  when: ansible_distribution_major_version | int >= 8

- name: Install common packages
  ansible.builtin.dnf:
    name:
      - qemu-guest-agent
      - xterm
      - vim
      - tree
      - git
      - python3
      - python3-pip
      - httpd-tools
      - iputils
      - openssh-server
    state: present

- name: Check if reboot is required
  ansible.builtin.command: dnf needs-restarting -r
  register: system_maintenance_needs_restart
  changed_when: false
  failed_when: system_maintenance_needs_restart.rc not in [0, 1]

- name: Reboot if required
  ansible.builtin.reboot:
    msg: Reboot triggered due to package update
    connect_timeout: 5
    reboot_timeout: 600
    test_command: whoami
  when: system_maintenance_needs_restart.rc == 1
