---
- name: Assert the host uses Debian 13
  ansible.builtin.assert:
    that:
    - ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] == '13'
    fail_msg: >-
      system maintenance supports Debian 13 only

- name: Run the explicit full update
  ansible.builtin.import_tasks: full-update.yml

- name: Configure native automatic security updates
  ansible.builtin.import_tasks: automatic-updates.yml

- name: Inspect reboot-required state
  ansible.builtin.import_tasks: reboot-state.yml
