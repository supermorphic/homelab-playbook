---
- name: Update package cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    force_apt_get: true
    lock_timeout: "{{ system_maintenance_package_lock_timeout }}"
  tags:
    - molecule-idempotence-notest

- name: Autoremove unused packages
  ansible.builtin.apt:
    autoremove: true
    force_apt_get: true
    lock_timeout: "{{ system_maintenance_package_lock_timeout }}"

- name: Autoclean cached packages
  ansible.builtin.apt:
    autoclean: true
    force_apt_get: true
    lock_timeout: "{{ system_maintenance_package_lock_timeout }}"
