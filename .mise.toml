min_version = { hard = "2026.7.5" }

[settings]
lockfile = true

[tools]
python = "3.13.14"
uv = "0.11.32"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
node = "24.18.0"
pre-commit = "4.6.2"
"aqua:rhysd/actionlint" = "1.7.12"
"npm:markdownlint-cli2" = "0.23.2"

[tasks.bootstrap]
description = "Install the locked controller and Galaxy dependencies"
run = "./scripts/bootstrap.sh"

[tasks.playbook]
description = "Run one playbook action against a named inventory"
run = "./scripts/playbook.sh"

[tasks."check:fast"]
description = "Run fast repository and security validation"
run = "./scripts/ci/check-fast.sh"

[tasks."check:ansible"]
description = "Run offline Ansible, inventory, and Vault validation"
run = "./scripts/ci/check-ansible.sh"

[tasks."ci:changed"]
description = "Classify local changes and run the required offline checks"
run = "uv run --frozen --no-sync python scripts/ci/run_changed.py"

[tasks.ci]
description = "Run complete offline validation"
run = '''
FULL_SECRET_SCAN=1 mise run check:fast
mise run check:ansible
'''
