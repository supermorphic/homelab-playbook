min_version = { hard = "2026.7.5" }

[settings]
lockfile = true

[tools]
python = "3.13.14"
sops = "3.13.2"
age = "1.3.1"
uv = "0.11.32"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
github-cli = "2.96.0"
node = "24.18.0"
pre-commit = "4.6.2"
"aqua:rhysd/actionlint" = "1.7.12"
# Reviewed manual fastq release matches its upstream tag; its successor restores provenance.
"npm:markdownlint-cli2" = { version = "0.23.2", trust_policy_excludes = ["fastq@1.20.2"] }

[tasks.bootstrap]
description = "Install the locked controller and Galaxy dependencies"
run = "./scripts/bootstrap.sh"

[tasks.playbook]
description = "Run one playbook action against a named inventory"
run = "./scripts/playbook.sh"

[tasks."validate:fast"]
description = "Run fast repository and security validation"
run = "./scripts/ci/validate-fast.sh"

[tasks."validate:ansible"]
description = "Run offline Ansible, inventory, and SOPS validation"
run = "./scripts/ci/validate-ansible.sh"

[tasks."test:secrets"]
description = "Test SOPS inventory loading with disposable identities"
run = "uv run --frozen --no-sync python -m unittest discover -s tests/secrets -p 'test_*.py' -v"

[tasks."test:tls"]
description = "Test TLS policy, publication and local TLS with disposable certificates"
run = "uv run --frozen --no-sync python -m unittest discover -s tests/tls -p 'test_*.py' -v"

[tasks."test:semaphore"]
description = "Test Semaphore automation with disposable fixtures"
run = "uv run --frozen --no-sync python scripts/semaphore/test.py"

[tasks."validate:secrets"]
description = "Validate encrypted inventory structure without decryption"
run = "uv run --frozen --no-sync python scripts/secrets/validate.py"

[tasks."secrets:sops"]
description = "Run SOPS with only the selected identity retrieval command"
run = "./scripts/secrets/sops.sh"

[tasks."secrets:bootstrap"]
description = "Operator: initialize or restore the dedicated Keychain identity"
run = "uv run --frozen --no-sync python scripts/secrets/keychain_setup.py"

[tasks."test:molecule"]
description = "Test registered Ansible roles in rootless Podman containers"
run = "uv run --frozen --no-sync python scripts/molecule.py"

[tasks."ci:changed"]
description = "Classify local changes and run required validation"
run = "uv run --frozen --no-sync python scripts/ci/run_changed.py"

[tasks."github-protection:check"]
description = "Check live GitHub main protection without making changes"
run = "uv run --frozen --no-sync python scripts/repository/github_protection.py check"

[tasks."github-protection:plan"]
description = "Plan live GitHub main protection reconciliation without making changes"
run = "uv run --frozen --no-sync python scripts/repository/github_protection.py plan"

[tasks."github-protection:apply"]
description = "Apply explicitly authorized GitHub main protection reconciliation"
run = "uv run --frozen --no-sync python scripts/repository/github_protection.py apply"

[tasks.ci]
description = "Run complete validation"
run = '''
FULL_SECRET_SCAN=1 mise run validate:fast
mise run validate:ansible
mise run test:molecule -- system_maintenance/default
mise run test:molecule -- system_maintenance/baseline
mise run test:molecule -- reverse_proxy/default
mise run test:molecule -- semaphore/default
mise run test:semaphore -- compatibility
mise run test:semaphore -- fixture
mise run test:semaphore -- controller
'''
